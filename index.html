<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Weather Bubble CarPlay</title>
  <style>
    :root {
      --accent: #90caf9;
      --accent-rgb: 144, 202, 249;
      --text: #f8fafc;
      --muted: #aebdce;
      --panel: #0d141e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .bubble {
      width: min( min(310px, 92vw), 92vh );
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 38%, #202b3a 0%, #111923 52%, #080c12 100%);
      border: 4px solid var(--accent);
      box-shadow:
        0 0 25px rgba(var(--accent-rgb), .68),
        inset 0 0 18px rgba(var(--accent-rgb), .22);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 22px 19px;
      text-align: center;
      transition: border-color .45s ease, box-shadow .45s ease;
      position: relative;
    }

    .city {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 650;
      color: #e5edf7;
      margin-bottom: 3px;
    }

    .main-temp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 58px;
    }

    .temp {
      font-size: 51px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: -2px;
    }

    .weather-icon {
      font-size: 38px;
      line-height: 1;
    }

    .desc {
      color: #d0dbea;
      font-size: 14px;
      font-weight: 550;
      margin: 2px 0 6px;
    }

    .divider {
      width: 88%;
      height: 1px;
      flex: 0 0 1px;
      background: rgba(255,255,255,.20);
      margin: 5px 0;
    }

    .details {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 91%;
      min-height: 47px;
    }

    .detail-box {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .detail-val {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 17px;
      font-weight: 750;
      white-space: nowrap;
    }

    .detail-icon {
      font-size: 20px;
      line-height: 1;
    }

    .detail-unit {
      font-size: 11px;
      font-weight: 550;
      color: #cbd5e1;
      margin-left: 1px;
    }

    .detail-lbl {
      font-size: 11px;
      color: var(--muted);
    }

    .vertical-divider {
      width: 1px;
      height: 31px;
      background: rgba(255,255,255,.25);
    }

    .rain-section {
      width: 100%;
      margin-top: 2px;
    }

    .rain-prob {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .rain-icon {
      font-size: 19px;
    }

    .rain-prob strong {
      font-size: 19px;
      font-weight: 800;
      color: var(--accent);
    }

    .rain-period {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      min-height: 13px;
    }

    .rain-alert {
      font-size: 10px;
      font-weight: 650;
      margin-top: 2px;
      color: var(--accent);
      min-height: 13px;
    }

    .updated {
      position: absolute;
      bottom: 22px;
      left: 0;
      width: 100%;
      color: #8190a3;
      font-size: 8px;
      opacity: .9;
    }

    .level-low {
      --accent: #90caf9;
      --accent-rgb: 144, 202, 249;
    }
    .level-mild {
      --accent: #ffd54f;
      --accent-rgb: 255, 213, 79;
    }
    .level-warn {
      --accent: #ff9800;
      --accent-rgb: 255, 152, 0;
    }
    .level-high {
      --accent: #ff453a;
      --accent-rgb: 255, 69, 58;
    }

    .level-low, .level-mild, .level-warn, .level-high {
      border-color: var(--accent);
      box-shadow:
        0 0 27px rgba(var(--accent-rgb), .72),
        inset 0 0 17px rgba(var(--accent-rgb), .27);
    }

    .error .desc { color: #ffb4ab; }

    @media (max-height: 360px) {
      .bubble { width: min(280px, 88vh); padding: 15px; }
      .temp { font-size: 44px; }
      .weather-icon { font-size: 32px; }
      .updated { bottom: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bubble { transition: none; }
    }
  </style>
</head>
<body>
  <main class="bubble level-low" id="bubble" aria-live="polite">
    <div class="city" id="city">📍 Đang xác định vị trí...</div>

    <div class="main-temp">
      <div class="temp" id="temp">--°</div>
      <div class="weather-icon" id="weather-icon">⛅</div>
    </div>
    <div class="desc" id="desc">Đang tải thời tiết...</div>

    <div class="divider"></div>

    <div class="details">
      <div class="detail-box">
        <div class="detail-val">
          <span class="detail-icon">💧</span>
          <span id="humidity">--%</span>
        </div>
        <div class="detail-lbl">Độ ẩm</div>
      </div>

      <div class="vertical-divider"></div>

      <div class="detail-box">
        <div class="detail-val">
          <span class="detail-icon">💨</span>
          <span id="wind">--</span>
          <small class="detail-unit">km/h</small>
        </div>
        <div class="detail-lbl">Tốc độ gió</div>
      </div>
    </div>

    <div class="divider"></div>

    <section class="rain-section">
      <div class="rain-prob">
        <span class="rain-icon">🌧️</span>
        <span>Mưa 3 giờ tới</span>
        <strong id="rain-pct">--%</strong>
      </div>
      <div class="rain-period" id="rain-period">Đang lấy dự báo theo giờ...</div>
      <div class="rain-alert" id="rain-msg">Đang cập nhật</div>
    </section>

    <div class="updated" id="updated">Đang kết nối dữ liệu...</div>
  </main>

  <script>
    "use strict";

    // Tọa độ mặc định khi không cấp được quyền GPS: Phủ Lý.
    const DEFAULT_LOCATION = {
      latitude: 20.5453,
      longitude: 105.9122,
      name: "Phủ Lý (mặc định)"
    };

    const REFRESH_INTERVAL_MS = 30 * 60 * 1000;
    const FORECAST_HOURS = 3;
    const TIME_ZONE = "Asia/Bangkok";

    const $ = (id) => document.getElementById(id);

    let currentLocation = null;
    let lastReverseGeocodeAt = 0;
    let refreshTimer = null;

    function setText(id, value) {
      $(id).textContent = value;
    }

    function weatherDescription(code) {
      if (code === 0) return { text: "Trời quang", icon: "☀️" };
      if (code === 1) return { text: "Ít mây", icon: "🌤️" };
      if (code === 2) return { text: "Có mây", icon: "⛅" };
      if (code === 3) return { text: "Nhiều mây", icon: "☁️" };
      if (code === 45 || code === 48) return { text: "Sương mù", icon: "🌫️" };
      if (code >= 51 && code <= 57) return { text: "Mưa phùn", icon: "🌦️" };
      if (code >= 61 && code <= 67) return { text: "Trời mưa", icon: "🌧️" };
      if (code >= 71 && code <= 77) return { text: "Có tuyết", icon: "🌨️" };
      if (code >= 80 && code <= 82) return { text: "Mưa rào", icon: "🌧️" };
      if (code === 85 || code === 86) return { text: "Mưa tuyết", icon: "🌨️" };
      if (code >= 95 && code <= 99) return { text: "Giông bão", icon: "⛈️" };
      return { text: "Chưa rõ thời tiết", icon: "🌡️" };
    }

    function parseApiLocalTime(value) {
      // API được yêu cầu trả giờ địa phương Asia/Bangkok dưới dạng YYYY-MM-DDTHH:mm.
      // So sánh chuỗi thời gian cùng định dạng để không phụ thuộc múi giờ của thiết bị.
      return typeof value === "string" ? value.slice(0, 16) : "";
    }

    function getNextHoursForecast(data) {
      const times = data?.hourly?.time;
      const probabilities = data?.hourly?.precipitation_probability;
      const currentApiTime = parseApiLocalTime(data?.current?.time);

      if (!Array.isArray(times) || !Array.isArray(probabilities) || !currentApiTime) {
        return null;
      }

      // Tìm giờ hiện tại theo timestamp do chính API trả về.
      // Chọn mốc giờ gần nhất không muộn hơn thời điểm hiện tại.
      // Nhờ vậy, nếu bây giờ là 15:35 thì giờ 15:00 vẫn được xem là giờ hiện tại,
      // và dự báo kế tiếp bắt đầu từ 16:00.
      let currentIndex = -1;
      for (let i = 0; i < times.length; i++) {
        if (parseApiLocalTime(times[i]) <= currentApiTime) currentIndex = i;
        else break;
      }
      if (currentIndex < 0) currentIndex = 0;

      const candidates = [];
      for (let offset = 1; offset <= FORECAST_HOURS; offset++) {
        const index = currentIndex + offset;
        if (index >= times.length) break;

        const raw = probabilities[index];
        if (raw === null || raw === undefined || !Number.isFinite(Number(raw))) continue;

        candidates.push({
          probability: Number(raw),
          time: parseApiLocalTime(times[index])
        });
      }

      if (!candidates.length) return null;

      // Lấy giờ có xác suất mưa cao nhất trong 3 giờ kế tiếp.
      // Khi bằng nhau, giữ mốc thời gian xuất hiện sớm hơn.
      return candidates.reduce((best, item) =>
        item.probability > best.probability ? item : best
      );
    }

    function formatHourRange(localTime) {
      if (!localTime) return "Chưa có mốc dự báo";
      const startHour = localTime.slice(11, 16);
      const [hour, minute] = startHour.split(":").map(Number);
      if (!Number.isFinite(hour) || !Number.isFinite(minute)) return startHour;

      // Cộng giờ trực tiếp trên giờ địa phương API để không lệch múi giờ thiết bị.
      const endHour = `${String((hour + 1) % 24).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
      return `${startHour}–${endHour}`;
    }

    function applyRainLevel(probability) {
      const bubble = $("bubble");
      const pct = $("rain-pct");
      const message = $("rain-msg");

      bubble.classList.remove("level-low", "level-mild", "level-warn", "level-high");

      let level = "level-low";
      let messageText = "Khả năng mưa thấp";
      if (probability >= 80) {
        level = "level-high";
        messageText = "Cảnh báo mưa rất cao";
      } else if (probability >= 60) {
        level = "level-warn";
        messageText = "Cảnh báo mưa";
      } else if (probability >= 40) {
        level = "level-mild";
        messageText = "Chú ý khả năng có mưa";
      }

      bubble.classList.add(level);
      pct.style.color = "var(--accent)";
      message.style.color = "var(--accent)";
      message.textContent = messageText;
    }

    async function fetchWeather(latitude, longitude) {
      const params = new URLSearchParams({
        latitude: String(latitude),
        longitude: String(longitude),
        current: "temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m",
        hourly: "precipitation_probability",
        timezone: TIME_ZONE,
        forecast_days: "2",
        wind_speed_unit: "kmh"
      });

      const url = `https://api.open-meteo.com/v1/forecast?${params.toString()}`;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);

      try {
        const response = await fetch(url, {
          method: "GET",
          signal: controller.signal,
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`Weather API trả về HTTP ${response.status}`);
        }

        const data = await response.json();
        if (!data.current) throw new Error("API không trả về dữ liệu thời tiết hiện tại.");

        const temperature = Number(data.current.temperature_2m);
        const humidity = Number(data.current.relative_humidity_2m);
        const wind = Number(data.current.wind_speed_10m);
        const code = Number(data.current.weather_code);

        setText("temp", Number.isFinite(temperature) ? `${Math.round(temperature)}°` : "--°");
        setText("humidity", Number.isFinite(humidity) ? `${Math.round(humidity)}%` : "--%");
        setText("wind", Number.isFinite(wind) ? Math.round(wind) : "--");

        const condition = weatherDescription(code);
        setText("desc", condition.text);
        setText("weather-icon", condition.icon);

        const forecast = getNextHoursForecast(data);
        if (forecast) {
          setText("rain-pct", `${Math.round(forecast.probability)}%`);
          setText("rain-period", `Khung giờ cao nhất: ${formatHourRange(forecast.time)}`);
          applyRainLevel(forecast.probability);
        } else {
          setText("rain-pct", "--%");
          setText("rain-period", "Chưa có dữ liệu dự báo theo giờ");
          applyRainLevel(0);
        }

        $("bubble").classList.remove("error");
        const updatedAt = new Intl.DateTimeFormat("vi-VN", {
          timeZone: TIME_ZONE,
          hour: "2-digit",
          minute: "2-digit",
          day: "2-digit",
          month: "2-digit",
          hour12: false
        }).format(new Date());

        setText("updated", `Cập nhật ${updatedAt}`);
      } finally {
        clearTimeout(timeout);
      }
    }

    async function fetchCityName(latitude, longitude) {
      // Tránh gọi reverse geocoding quá thường xuyên.
      const now = Date.now();
      if (now - lastReverseGeocodeAt < 30 * 60 * 1000) return;
      lastReverseGeocodeAt = now;

      try {
        const params = new URLSearchParams({
          format: "jsonv2",
          lat: String(latitude),
          lon: String(longitude),
          "accept-language": "vi"
        });

        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?${params.toString()}`,
          { headers: { "Accept": "application/json" }, cache: "no-store" }
        );
        if (!response.ok) throw new Error("Không tra cứu được tên địa điểm.");

        const data = await response.json();
        const address = data.address || {};
        const name = address.city || address.town || address.municipality ||
                     address.county || address.state || "Vị trí hiện tại";
        setText("city", `📍 ${name}`);
      } catch (error) {
        // Giữ tên vị trí mặc định/đã có nếu dịch vụ địa danh không phản hồi.
      }
    }

    function useFallbackLocation(reason) {
      currentLocation = {
        latitude: DEFAULT_LOCATION.latitude,
        longitude: DEFAULT_LOCATION.longitude,
        name: DEFAULT_LOCATION.name
      };
      setText("city", `📍 ${DEFAULT_LOCATION.name}`);
      if (reason) setText("updated", reason);
      refreshForCurrentLocation();
    }

    async function refreshForCurrentLocation() {
      if (!currentLocation) return;
      try {
        await fetchWeather(currentLocation.latitude, currentLocation.longitude);
      } catch (error) {
        $("bubble").classList.add("error");
        setText("desc", "Không tải được thời tiết");
        setText("rain-msg", "Kiểm tra kết nối mạng");
        setText("updated", error.name === "AbortError" ? "Kết nối quá thời gian" : "Đang chờ kết nối");
      }
    }

    function getLocationAndWeather() {
      if (!navigator.geolocation) {
        useFallbackLocation("GPS không khả dụng · dùng vị trí mặc định");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          currentLocation = { latitude, longitude, name: "Vị trí hiện tại" };
          await Promise.allSettled([
            refreshForCurrentLocation(),
            fetchCityName(latitude, longitude)
          ]);
        },
        () => useFallbackLocation("Không có quyền GPS · dùng Phủ Lý"),
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 5 * 60 * 1000
        }
      );
    }

    function startWeatherWidget() {
      getLocationAndWeather();

      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        // Thử lấy vị trí mới; nếu GPS lỗi thì giữ vị trí hiện có.
        if (!navigator.geolocation) {
          refreshForCurrentLocation();
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            currentLocation = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              name: "Vị trí hiện tại"
            };
            refreshForCurrentLocation();
            fetchCityName(position.coords.latitude, position.coords.longitude);
          },
          () => refreshForCurrentLocation(),
          { enableHighAccuracy: false, timeout: 8000, maximumAge: 10 * 60 * 1000 }
        );
      }, REFRESH_INTERVAL_MS);
    }

    startWeatherWidget();
  </script>
</body>
</html>
