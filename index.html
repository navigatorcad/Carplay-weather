<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Weather CarPlay Widget</title>
<style>
:root{--temp-accent:#34d399;--rain-accent:#4fc3f7;--text:#f8fafc;--muted:#aebdce;--glass-fill:.12;--glass-blur:3px;--glass-sheen:.13}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100vh;overflow:hidden;background:transparent;color:var(--text)}
body{display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;isolation:isolate}

/* AURA */
.aura-bg{position:fixed;inset:0;pointer-events:none;z-index:0;transition:opacity 2s}
.aura-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6;animation:floatAura 15s ease-in-out infinite alternate}
.orb-1{width:240px;height:240px;top:-10%;left:-10%;background:rgba(79,195,247,.6)}
.orb-2{width:260px;height:260px;bottom:-15%;right:-10%;background:rgba(52,211,153,.45);animation-delay:-5s}
@keyframes floatAura{to{transform:translate(25px,35px) scale(1.15)}}
body.page-paused .aura-orb,body.page-paused .weather-icon{animation-play-state:paused!important}
body.aura-dawn{background:radial-gradient(circle at 50% 30%,#1b324f 0%,#0e1a2b 60%,#05080f 100%)}
body.aura-noon{background:radial-gradient(circle at 50% 30%,#193563 0%,#0c1830 60%,#03060c 100%)}
body.aura-sunset{background:radial-gradient(circle at 50% 30%,#4d2132 0%,#24101f 60%,#0a0408 100%)}
body.aura-night{background:radial-gradient(circle at 50% 30%,#0e1424 0%,#060912 60%,#010204 100%)}
body.aura-night .aura-orb{opacity:.25}

.weather-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* LAYOUT + CO GIÃN */
.main-wrapper{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;width:100%;height:100%;padding:4px;overflow:hidden}
.scale-stage{display:flex;flex-direction:column;align-items:center;width:max-content;transform-origin:center center}
.widget-container{display:flex;justify-content:center;align-items:center;width:auto}

/* LIQUID GLASS TRONG SUỐT */
.bubble,.card{
  background:
    radial-gradient(140% 100% at 12% -10%,rgba(255,255,255,calc(var(--glass-sheen)*1.6)) 0%,rgba(255,255,255,calc(var(--glass-sheen)*.35)) 30%,transparent 62%),
    radial-gradient(120% 90% at 100% 112%,rgba(255,255,255,calc(var(--glass-sheen)*.7)) 0%,transparent 55%),
    rgba(8,14,26,var(--glass-fill));
  backdrop-filter:blur(var(--glass-blur)) saturate(170%) brightness(1.08) contrast(1.04);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(170%) brightness(1.08) contrast(1.04);
  text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 8px rgba(0,0,0,.35);
  border-radius:22px;border:none;
  box-shadow:
    0 12px 32px rgba(0,0,0,.28),
    0 0 12px var(--temp-accent),
    0 0 12px var(--rain-accent),
    inset 0 1.5px 0 rgba(255,255,255,.75),
    inset 0 -1.5px 0 rgba(255,255,255,.25),
    inset 1.5px 0 0 rgba(255,255,255,.28),
    inset -1px 0 0 rgba(255,255,255,.12),
    inset 0 0 28px rgba(255,255,255,.10),
    inset 0 0 2px 1px rgba(255,255,255,.18);
  display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;transition:box-shadow .4s;overflow:hidden;cursor:pointer}
.bubble::after,.card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;
  background:linear-gradient(to bottom,var(--temp-accent) 0%,var(--temp-accent) 48%,var(--rain-accent) 52%,var(--rain-accent) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;z-index:2}
.bubble::before,.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(118deg,rgba(255,255,255,calc(var(--glass-sheen)*1.8)) 0%,rgba(255,255,255,calc(var(--glass-sheen)*.4)) 22%,transparent 46%,transparent 78%,rgba(255,255,255,calc(var(--glass-sheen)*.5)) 100%);pointer-events:none;z-index:0}
.bubble>*,.card>*,.bubble-inner>*{position:relative;z-index:3}

/* BUBBLE (TRÒN) */
.bubble{width:310px;height:auto;aspect-ratio:1/1;border-radius:50%;justify-content:center;padding:4% 3%}
.bubble::after{border-radius:50%}
.bubble .bubble-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;transform-origin:center center}
.card .bubble-inner{display:contents}
.bubble .city-container{font-size:10px;max-width:calc(72%/var(--bk,1));margin-bottom:0}
.bubble .main-temp{gap:5px}
.bubble .temp{font-size:32px;letter-spacing:-1px}
.bubble .weather-icon{font-size:24px}
.bubble .desc{font-size:10px;line-height:1.1}
.bubble .aqi-uv,.bubble .temp-range{font-size:8.5px}
.bubble .divider{width:calc(50%/var(--bk,1));margin:1px 0}
.bubble .details{width:auto;gap:16px}
.bubble .detail-val{font-size:11px;gap:2px}
.bubble .detail-icon{font-size:11px}
.bubble .detail-unit,.bubble .detail-lbl{font-size:8px}
.bubble .vertical-divider{height:12px}
.bubble .rain-section{transform:scale(.85);margin-top:-3px}
.bubble .rain-prob{font-size:9px;gap:2px}
.bubble .rain-icon{font-size:11px}
.bubble .rain-prob strong{font-size:11px}
.bubble .rain-period{font-size:7.5px}
.bubble .rain-alert,.hourly-section,.bubble .updated{display:none}

/* CARD (CHỮ NHẬT): rộng vừa đủ nội dung, tên địa điểm không làm card phình ra */
.card{width:max-content;min-width:200px;max-width:none;height:auto;max-height:none;justify-content:flex-start;padding:10px;gap:4px;white-space:nowrap}
.card .city-container{width:0;min-width:100%;max-width:none;justify-content:center}
.card .details{gap:14px}
.bubble:active,.card:active{transform:scale(.985)}

.city-container{display:flex;align-items:center;max-width:92%;overflow:hidden;font-size:12px;font-weight:700;color:#f1f5f9;text-shadow:0 1px 3px rgba(0,0,0,.45);flex-shrink:0;margin-bottom:2px}
.city-pin{flex-shrink:0;margin-right:2px}
.city-viewport{overflow:hidden;width:100%;position:relative;white-space:nowrap}
.city-track{display:inline-block;white-space:nowrap}
.city-track.marquee-active{display:inline-flex;animation:smoothScroll 14s linear infinite}
.city-text{display:inline-block;white-space:nowrap}
@keyframes smoothScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

.clock-text{font-variant-numeric:tabular-nums}

/* GIỜ TRONG CARD */
.card-time-block{width:100%;display:none;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;margin-bottom:2px}
@keyframes rainbow-move{0%{background-position:0% center}100%{background-position:200% center}}
.card .card-time-block .clock-text{font-size:26px;font-weight:900;letter-spacing:.5px;line-height:1.05;
  background:linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#9400d3,#ff0000);background-size:200% auto;
  color:transparent;-webkit-background-clip:text;background-clip:text;animation:rainbow-move 3s linear infinite;
  text-shadow:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.card-time-block .solar-date{font-size:10px;font-weight:700;color:#f1f5f9}
.card-time-block .lunar-date{font-size:9.5px;font-weight:700;color:#ffd54f}

/* GIỜ NGOÀI (BUBBLE) - phóng theo --bar-k */
.external-time-bar{display:none;width:310px;margin-top:6px;text-align:center;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;white-space:nowrap}
.external-time-bar .clock-text{font-size:calc(22px*var(--bar-k,1));font-weight:900;color:#64b5f6;text-shadow:0 2px 6px rgba(0,0,0,.95),0 0 10px rgba(100,181,246,.8);line-height:1.05}
.external-time-bar .solar-date{font-size:calc(9.5px*var(--bar-k,1));font-weight:700;color:#f1f5f9}
.external-time-bar .lunar-date{font-size:calc(9px*var(--bar-k,1));font-weight:700;color:#ffd54f}

.main-temp{display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;margin:2px 0}
.temp{font-size:36px;line-height:1;font-weight:800;letter-spacing:-1.5px;text-shadow:0 2px 10px rgba(0,0,0,.35);color:var(--temp-accent)}

/* ICON THỜI TIẾT */
.weather-icon{font-size:28px;line-height:1;display:inline-block;transform-origin:center;will-change:transform,filter;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
@keyframes sunGlowSpin{0%{transform:scale(1);filter:drop-shadow(0 0 4px rgba(253,224,71,.35))}50%{transform:scale(1.12);filter:drop-shadow(0 0 12px rgba(253,224,71,.75))}100%{transform:scale(1);filter:drop-shadow(0 0 4px rgba(253,224,71,.35))}}
@keyframes cloudDrift{0%,100%{transform:translate3d(-2px,0,0) scale(1);filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}50%{transform:translate3d(3px,-2.5px,0) scale(1.04);filter:drop-shadow(0 5px 8px rgba(148,163,184,.45))}}
@keyframes rainDropPulse{0%,100%{transform:translate3d(0,-1.5px,0) scale(1);filter:drop-shadow(0 2px 5px rgba(56,189,248,.35))}50%{transform:translate3d(0,2.5px,0) scale(1.06);filter:drop-shadow(0 4px 10px rgba(56,189,248,.7))}}
@keyframes stormFlashShake{0%,100%{transform:translate3d(0,0,0) rotate(0) scale(1);filter:drop-shadow(0 2px 6px rgba(250,204,21,.3))}20%{transform:translate3d(-2.5px,0,0) rotate(-4deg) scale(1.05)}40%{transform:translate3d(2.5px,-1px,0) rotate(4deg) scale(1.08);filter:drop-shadow(0 0 14px rgba(250,204,21,.9))}60%{transform:translate3d(-1.5px,1px,0) rotate(-2deg) scale(1.02)}80%{transform:translate3d(1.5px,0,0) rotate(2deg) scale(1)}}
@keyframes fogPulse{0%,100%{transform:scale(.98);opacity:.82}50%{transform:scale(1.05);opacity:1}}
.weather-icon.anim-sunny{animation:sunGlowSpin 5s ease-in-out infinite}
.weather-icon.anim-cloudy{animation:cloudDrift 4.5s ease-in-out infinite}
.weather-icon.anim-rain{animation:rainDropPulse 1.8s ease-in-out infinite}
.weather-icon.anim-storm{animation:stormFlashShake 1.4s ease-in-out infinite}
.weather-icon.anim-fog{animation:fogPulse 4s ease-in-out infinite}
.weather-icon svg{width:1.18em;height:1.18em;display:block;overflow:visible}
.weather-icon svg .sun-core{fill:#fbbf24}
.weather-icon svg .sun-ray{stroke:#fde68a;stroke-width:3;stroke-linecap:round}
.weather-icon svg .cloud-shape{fill:#dbeafe;stroke:#bfdbfe;stroke-width:1.5}
.weather-icon svg .rain-line{stroke:#38bdf8;stroke-width:2.5;stroke-linecap:round}
.weather-icon svg .snowflake{stroke:#bae6fd;stroke-width:2;stroke-linecap:round}
.weather-icon svg .bolt{fill:#facc15;stroke:#fef08a;stroke-width:1}
.weather-icon.anim-sunny svg .sun-ray{transform-box:fill-box;transform-origin:center;animation:svgSunRotate 12s linear infinite}
.weather-icon.anim-rain svg .rain-line{animation:svgRainFall .9s ease-in-out infinite alternate}
.weather-icon.anim-storm svg .bolt{animation:svgBoltFlash 1.4s steps(2,end) infinite}
.weather-icon.anim-cloudy svg .cloud-shape{animation:svgCloudFloat 4s ease-in-out infinite}
@keyframes svgSunRotate{to{transform:rotate(360deg)}}
@keyframes svgRainFall{to{transform:translateY(3px);opacity:.55}}
@keyframes svgBoltFlash{0%,75%,100%{opacity:1}80%,90%{opacity:.25}}
@keyframes svgCloudFloat{50%{transform:translateX(2px)}}
.weather-icon svg .moon-core{fill:#fde68a;stroke:#fef3c7;stroke-width:.8;stroke-linejoin:round}
.weather-icon svg .moon-star{stroke:#e0f2fe;stroke-width:1.6;stroke-linecap:round}
.weather-icon svg .moon-dot{fill:#e0f2fe}
@keyframes moonGlow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 4px rgba(253,230,138,.3))}50%{transform:scale(1.06);filter:drop-shadow(0 0 12px rgba(253,230,138,.65))}}
@keyframes svgStarTwinkle{from{opacity:.35}to{opacity:1}}
.weather-icon.anim-moon{animation:moonGlow 5s ease-in-out infinite}
.weather-icon.anim-moon svg .moon-star,.weather-icon.anim-moon svg .moon-dot{animation:svgStarTwinkle 2.4s ease-in-out infinite alternate}

.desc{color:#e2e8f0;font-size:11px;font-weight:600;max-width:95%;flex-shrink:0;margin-bottom:2px}
.aqi-uv{font-size:10px;font-weight:700;color:var(--rain-accent);flex-shrink:0}
.temp-range{font-size:10px;font-weight:650;color:var(--muted);flex-shrink:0;margin-bottom:3px}
.divider{width:90%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);margin:4px 0;flex-shrink:0}
.details{display:flex;justify-content:space-around;align-items:center;width:96%;flex-shrink:0;margin:2px 0}
.detail-box{display:flex;flex-direction:column;align-items:center;gap:1px}
.detail-val{display:flex;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:800;white-space:nowrap}
.detail-icon{font-size:13px;line-height:1}
.detail-unit{font-size:10px;font-weight:600;color:#cbd5e1}
.detail-lbl{font-size:10px;color:var(--muted);font-weight:600}
.vertical-divider{width:1px;height:15px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.32),transparent)}

.rain-section{width:100%;flex-shrink:0;margin:2px 0}
.rain-prob{display:flex;justify-content:center;align-items:center;gap:4px;font-size:10.5px;font-weight:650;white-space:nowrap}
.rain-icon{font-size:13px}
.rain-prob strong{font-size:13px;font-weight:850;color:var(--rain-accent)}
.rain-period{font-size:9px;color:var(--muted);margin-top:1px;font-weight:600}
.rain-alert{font-size:9px;font-weight:700;color:var(--rain-accent)}
.updated{width:100%;color:#94a3b8;font-size:7px;opacity:.95;flex-shrink:0;font-weight:600;margin-top:4px}

.hourly-section{display:none;width:100%;margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,.22);flex-shrink:0}
.card .hourly-section{display:block}
.hourly-title{font-size:8px;color:var(--muted);font-weight:750;margin-bottom:2px;text-align:left}
.hourly-list{display:grid;grid-template-columns:repeat(var(--hcols,6),1fr);gap:2px}
.hour-item{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 1px;border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.015))}
.hour-time{font-size:6.5px;color:#e2e8f0;font-weight:650}
.hour-icon{font-size:9.5px;line-height:1.1}
.hour-temp{font-size:8.5px;font-weight:800}
.hour-rain{font-size:6.5px;color:#90caf9;font-weight:700}

/* ĐIỀU KHIỂN */
.mode-controls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(calc(100% + 40px));visibility:hidden;width:92%;max-width:310px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;background:rgba(10,16,28,.94);border:1px solid rgba(79,195,247,.45);border-radius:14px;backdrop-filter:blur(20px) saturate(190%);-webkit-backdrop-filter:blur(20px) saturate(190%);box-shadow:0 8px 24px rgba(0,0,0,.65);transition:transform .35s cubic-bezier(.16,1,.3,1),visibility 0s linear .35s;z-index:9999;pointer-events:none}
.mode-controls.visible{transform:translateX(-50%) translateY(0);visibility:visible;transition:transform .35s cubic-bezier(.16,1,.3,1),visibility 0s;pointer-events:auto}
.handle-bar{width:36px;height:4px;background:rgba(255,255,255,.35);border-radius:2px;margin-bottom:1px;cursor:pointer}
.mode-toggle-btn{width:100%;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(20,30,45,.75));border:1px solid rgba(79,195,247,.85);color:#fff;font-size:11px;font-weight:750;padding:4px 8px;border-radius:8px;cursor:pointer;text-align:center}
.opacity-control{width:100%;display:flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid rgba(79,195,247,.7);border-radius:8px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(20,30,45,.7));color:#fff;font-size:9.5px}
.opacity-control label{white-space:nowrap;color:#e0f2fe;font-weight:700}
.opacity-control input{flex:1;min-width:20px;accent-color:#4fc3f7;height:14px;cursor:pointer}
.opacity-value{width:24px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}

.error .desc{color:#ffb4ab}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<body>
<div class="aura-bg">
  <div class="aura-orb orb-1"></div>
  <div class="aura-orb orb-2"></div>
</div>

<canvas class="weather-fx" id="weatherFxCanvas"></canvas>

<div class="main-wrapper" id="mainWrapper">
 <div class="scale-stage" id="scaleStage">
  <div class="widget-container">
    <main class="bubble" id="widgetShape">
    <div class="bubble-inner" id="bubbleInner">

      <div class="city-container">
        <span class="city-pin">📍</span>
        <div class="city-viewport" id="cityViewport">
          <div class="city-track" id="cityTrack">
            <span class="city-text" id="cityText">Đang tải địa điểm...</span>
          </div>
        </div>
      </div>

      <div class="card-time-block" id="cardTimeBlock">
        <div class="clock-text" id="cardClock">--:--:--</div>
        <div class="solar-date" id="cardSolar">--</div>
        <div class="lunar-date" id="cardLunar">--</div>
      </div>

      <div class="main-temp">
        <div class="temp" id="temp">--°</div>
        <div class="weather-icon" id="weather-icon">⛅</div>
      </div>

      <div class="desc" id="desc">Đang tải thời tiết...</div>
      <div class="aqi-uv" id="aqi-uv">AQI: -- · UV: --</div>
      <div class="temp-range" id="temp-range">--° / --°</div>
      <div class="divider"></div>

      <div class="details">
        <div class="detail-box">
          <div class="detail-val"><span class="detail-icon">💧</span><span id="humidity">--%</span></div>
          <div class="detail-lbl">Độ ẩm</div>
        </div>
        <div class="vertical-divider"></div>
        <div class="detail-box">
          <div class="detail-val"><span class="detail-icon">💨</span><span id="wind">--</span><small class="detail-unit">km/h</small></div>
          <div class="detail-lbl">Tốc độ gió</div>
        </div>
      </div>

      <div class="divider"></div>

      <section class="rain-section">
        <div class="rain-prob">
          <span class="rain-icon">🌧️</span>
          <span>Mưa 3 giờ tới</span>
          <strong id="rain-pct">--%</strong>
        </div>
        <div class="rain-period" id="rain-period">Đang lấy dự báo...</div>
        <div class="rain-alert" id="rain-msg">Đang cập nhật</div>
      </section>

      <section class="hourly-section" id="hourlySection">
        <div class="hourly-title">DỰ BÁO THEO GIỜ</div>
        <div class="hourly-list" id="hourlyList"><span class="hour-time">Đang tải...</span></div>
      </section>

      <div class="updated" id="updated">Đang kết nối dữ liệu...</div>
    </div>
    </main>
  </div>

  <div class="external-time-bar" id="externalTimeBar">
    <div class="clock-text" id="extClock">--:--:--</div>
    <div class="solar-date" id="extSolar">--</div>
    <div class="lunar-date" id="extLunar">--</div>
  </div>
 </div>
</div>

<div class="mode-controls" id="modeControls">
  <div class="handle-bar" id="handleBar" title="Đóng menu"></div>
  <button class="mode-toggle-btn" id="modeToggleBtn" type="button">🔄 Đổi Form</button>
  <div class="opacity-control">
    <label for="opacitySlider">Độ trong suốt</label>
    <input id="opacitySlider" type="range" min="5" max="95" step="1" value="80">
    <span class="opacity-value" id="opacityValue">80%</span>
  </div>
    <button class="mode-toggle-btn" id="debugToggleBtn" type="button">🐞 Bật thông số kiểm tra</button>
</div>
<script>
"use strict";

const DEFAULT_LOCATION={latitude:20.5453,longitude:105.9122,name:"P. Hai Bà Trưng, TP. Phủ Lý"};

const REFRESH_INTERVAL_MS=15*60*1000;
const FORECAST_HOURS=3;
const TIME_ZONE="Asia/Ho_Chi_Minh";

const WEATHER_LOCATION_MIN_DISTANCE=1000;
const WEATHER_MIN_FETCH_INTERVAL_MS=60*1000;
const WEATHER_RETRY_BASE_MS=15*1000;
const CACHE_FRESH_MS=15*60*1000;
const CACHE_WARNING_MS=30*60*1000;
const CACHE_STALE_MS=60*60*1000;

const CACHE_KEY="carplay_weather_cache_v51";
const LAYOUT_KEY="carplay_layout_mode_v20";

/* ===== PANEL ĐIỀU KHIỂN ===== */
let touchStartY=0;
let controlsVisible=false;
let autoHideTimer=null;

function resetAutoHideTimer(){
  if(autoHideTimer){clearTimeout(autoHideTimer);autoHideTimer=null;}
  if(controlsVisible){
    autoHideTimer=setTimeout(()=>setControlsVisibility(false),2000);
  }
}

function setControlsVisibility(visible){
  controlsVisible=visible;
  const panel=$("modeControls");
  if(visible){
    panel.classList.add("visible");
    resetAutoHideTimer();
  }else{
    panel.classList.remove("visible");
    if(autoHideTimer){clearTimeout(autoHideTimer);autoHideTimer=null;}
  }
}

window.addEventListener("touchstart",e=>{
  const target=e.target;
  if(target&&target.closest&&target.closest("button,input,select,textarea,.mode-controls")){
    touchStartY=0;return;
  }
  if(e.touches.length>0)touchStartY=e.touches[0].clientY;
},{passive:true});

window.addEventListener("touchend",e=>{
  if(!touchStartY)return;
  if(e.changedTouches.length>0){
    const diffY=touchStartY-e.changedTouches[0].clientY;
    if(diffY>40)setControlsVisibility(true);
    else if(diffY<-40)setControlsVisibility(false);
  }
  touchStartY=0;
},{passive:true});

$("modeControls").addEventListener("touchstart",()=>resetAutoHideTimer(),{passive:true});
$("modeControls").addEventListener("click",()=>resetAutoHideTimer());
$("handleBar").addEventListener("click",()=>setControlsVisibility(false));

function safeStorageGet(key){try{return localStorage.getItem(key)}catch(_){return null}}
function safeStorageSet(key,value){try{localStorage.setItem(key,value)}catch(_){}}

function setText(id,value){
  const el=$(id);
  if(el)el.textContent=value==null?"":String(value);
}

function isValidNumber(value){
  return value!==null&&value!==undefined&&value!==""&&Number.isFinite(Number(value));
}

function toFiniteNumber(value,fallback=null){
  return isValidNumber(value)?Number(value):fallback;
}

function locationKey(lat,lon){
  return `${Number(lat).toFixed(4)},${Number(lon).toFixed(4)}`;
}

function distanceMeters(lat1,lon1,lat2,lon2){
  const R=6371000,rad=Math.PI/180;
  const dLat=(lat2-lat1)*rad,dLon=(lon2-lon1)*rad;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function isStillCurrentLocation(lat,lon){
  if(!currentLocation)return false;
  return locationKey(lat,lon)===locationKey(currentLocation.latitude,currentLocation.longitude);
}

function getVietnamHour(){
  return Number(new Intl.DateTimeFormat("en-US",{timeZone:TIME_ZONE,hour:"2-digit",hourCycle:"h23"}).format(new Date()));
}

/* Ban đêm: ưu tiên is_day từ API, dự phòng theo giờ */
function isNightNow(){
  if(lastIsDay!==null)return !lastIsDay;
  const h=getVietnamHour();
  return h>=18||h<5;
}

/* ===== ÂM LỊCH (Hồ Ngọc Đức) ===== */
function INT(d){return Math.floor(d)}

function jdFromDate(dd,mm,yy){
  const a=INT((14-mm)/12);
  const y=yy+4800-a;
  const m=mm+12*a-3;
  let jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-INT(y/100)+INT(y/400)-32045;
  if(jd<2299161)jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-32083;
  return jd;
}

function newMoon(k){
  const T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;
  let jd=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
  jd+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
  const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
  const Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
  const F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  const C=
    (0.1734-0.000393*T)*Math.sin(M*dr)+
    0.0021*Math.sin(2*M*dr)-
    0.4068*Math.sin(Mpr*dr)+
    0.0161*Math.sin(2*Mpr*dr)-
    0.0004*Math.sin(3*Mpr*dr)+
    0.0104*Math.sin(2*F*dr)-
    0.0051*Math.sin((M+Mpr)*dr)-
    0.0074*Math.sin((M-Mpr)*dr)+
    0.0004*Math.sin((2*F+M)*dr)-
    0.0004*Math.sin((2*F-M)*dr)-
    0.0006*Math.sin((2*F+Mpr)*dr)+
    0.0010*Math.sin((2*F-Mpr)*dr)+
    0.0005*Math.sin((2*Mpr+M)*dr);
  const deltaT=T<-11
    ?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3
    :-0.000278+0.000265*T+0.000262*T2;
  return jd+C-deltaT;
}

function getNewMoonDay(k,tz=7){return INT(newMoon(k)+0.5+tz/24)}

function sunLongitudeAngle(jdn){
  const T=(jdn-2451545)/36525,T2=T*T,dr=Math.PI/180;
  const M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  const L0=280.46645+36000.76983*T+0.0003032*T2;
  const DL=
    (1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M)+
    (0.019993-0.000101*T)*Math.sin(2*dr*M)+
    0.000290*Math.sin(3*dr*M);
  let L=(L0+DL)*dr;
  L-=Math.PI*2*INT(L/(Math.PI*2));
  return L;
}

function sunLongitude(jdn){return INT(sunLongitudeAngle(jdn)/(Math.PI/6))}
function getSunLongitude(dayNumber,tz=7){return sunLongitude(dayNumber-0.5-tz/24)}

function getWinterSolsticeDay(year,tz=7){
  const approximateJD=jdFromDate(21,12,year)-0.5;
  let low=approximateJD-4,high=approximateJD+4;
  for(let i=0;i<45;i++){
    const mid=(low+high)/2;
    if(sunLongitudeAngle(mid)<Math.PI*1.5)low=mid;else high=mid;
  }
  return INT((low+high)/2+0.5+tz/24);
}

function getLunarMonth11(year,tz=7){
  const solsticeDay=getWinterSolsticeDay(year,tz);
  let k=INT((solsticeDay-2415021.076998695)/29.530588853);
  while(getNewMoonDay(k,tz)>solsticeDay)k--;
  while(getNewMoonDay(k+1,tz)<=solsticeDay)k++;
  return getNewMoonDay(k,tz);
}

function getLeapMonthOffset(a11,tz=7){
  const k=INT(0.5+(a11-2415021.076998695)/29.530588853);
  let last=0,i=1;
  let arc=getSunLongitude(getNewMoonDay(k+i,tz),tz);
  do{
    last=arc;i++;
    arc=getSunLongitude(getNewMoonDay(k+i,tz),tz);
  }while(arc!==last&&i<14);
  return i-1;
}

function convertSolar2Lunar(dd,mm,yy,tz=7){
  const dayNumber=jdFromDate(dd,mm,yy);
  const k=INT((dayNumber-2415021.076998695)/29.530588853);
  let monthStart=getNewMoonDay(k+1,tz);
  if(monthStart>dayNumber)monthStart=getNewMoonDay(k,tz);
  let a11=getLunarMonth11(yy,tz);
  let b11=a11;
  let lunarYear;
  if(a11>=monthStart){
    lunarYear=yy;
    a11=getLunarMonth11(yy-1,tz);
  }else{
    lunarYear=yy+1;
    b11=getLunarMonth11(yy+1,tz);
  }
  const lunarDay=dayNumber-monthStart+1;
  const diff=INT((monthStart-a11)/29);
  let lunarMonth=diff+11;
  let lunarLeap=0;
  if(b11-a11>365){
    const leapMonth=getLeapMonthOffset(a11,tz);
    if(diff>=leapMonth){
      lunarMonth=diff+10;
      if(diff===leapMonth)lunarLeap=1;
    }
  }
  if(lunarMonth>12)lunarMonth-=12;
  if(lunarMonth>=11&&diff<4)lunarYear--;
  return{day:lunarDay,month:lunarMonth,year:lunarYear,leap:lunarLeap};
}

function getVietnamDateParts(date=new Date()){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:TIME_ZONE,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
  const values={};
  for(const part of parts){
    if(part.type!=="literal")values[part.type]=Number(part.value);
  }
  return values;
}

function getLunarDateFormatted(date=new Date()){
  try{
    const solar=getVietnamDateParts(date);
    const lunar=convertSolar2Lunar(solar.day,solar.month,solar.year,7);
    return `Ngày ${lunar.day} tháng ${lunar.month}${lunar.leap?" nhuận":""} năm ${lunar.year} ÂL`;
  }catch(_){
    return "Âm lịch không khả dụng";
  }
}

/* ===== HIỆU ỨNG NỀN (CANVAS) ===== */
const canvas=$("weatherFxCanvas");
try{canvasCtx=canvas.getContext("2d",{alpha:true})}catch(_){canvasCtx=null}

function resizeCanvas(){
  if(!canvasCtx)return;
  const dpr=Math.min(window.devicePixelRatio||1,1.5);
  const w=window.innerWidth,h=window.innerHeight;
  canvas.width=Math.round(w*dpr);
  canvas.height=Math.round(h*dpr);
  canvas.style.width=w+"px";
  canvas.style.height=h+"px";
  canvasCtx.setTransform(dpr,0,0,dpr,0,0);
  if(fxType!=="none")initParticles(fxType,particleCount(fxType));
}

function particleCount(type){
  if(type==="stars")return Math.round(Math.min(140,Math.max(40,window.innerWidth*window.innerHeight/6000)));
  return({sunny:24,snow:32,drizzle:28,rain:42,storm:50,fog:5})[type]||0;
}

function initParticles(type,count){
  particles=[];
  shootingStar=null;
  const w=window.innerWidth,h=window.innerHeight;
  for(let i=0;i<count;i++){
    if(type==="sunny"){
      particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+1,dx:(Math.random()-.5)*.25,dy:(Math.random()-.5)*.25,a:Math.random()*.35+.1});
    }else if(type==="snow"){
      particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.5+1,dy:Math.random()*.8+.4,dx:(Math.random()-.5)*.35,a:Math.random()*Math.PI*2});
    }else if(type==="drizzle"||type==="rain"||type==="storm"){
      particles.push({x:Math.random()*w,y:Math.random()*h,len:type==="drizzle"?Math.random()*8+5:Math.random()*17+10,s:type==="drizzle"?Math.random()*3+2:Math.random()*7+8});
    }else if(type==="fog"){
      particles.push({x:Math.random()*w,y:Math.random()*h,w:Math.random()*180+100,h:Math.random()*30+15,s:Math.random()*.35+.15,a:Math.random()*.08+.035});
    }else if(type==="stars"){
      particles.push({
        x:Math.random()*w,y:Math.random()*h,
        r:Math.random()<.12?Math.random()*1.2+1.4:Math.random()*.9+.3,
        a:Math.random(),
        da:(Math.random()*.012+.004)*(Math.random()<.5?-1:1),
        tint:Math.random()<.2?(Math.random()<.5?1:2):0
      });
    }
  }
}

function drawFrame(){
  if(!pageActive||!canvasCtx){rafId=0;return;}
  const c=canvasCtx,w=window.innerWidth,h=window.innerHeight;
  c.clearRect(0,0,w,h);

  if(fxType==="stars"){
    for(const p of particles){
      p.a+=p.da;
      if(p.a>=1){p.a=1;p.da=-Math.abs(p.da);}
      else if(p.a<=.15){p.a=.15;p.da=Math.abs(p.da);}
      const col=p.tint===1?"200,225,255":p.tint===2?"255,236,200":"255,255,255";
      c.fillStyle=`rgba(${col},${p.a})`;
      c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();
      if(p.r>1.5){
        c.fillStyle=`rgba(${col},${p.a*.18})`;
        c.beginPath();c.arc(p.x,p.y,p.r*3,0,Math.PI*2);c.fill();
      }
    }
    if(!shootingStar&&Math.random()<.0015){
      shootingStar={x:w*.1+Math.random()*w*.8,y:Math.random()*h*.35,vx:6+Math.random()*3,vy:3+Math.random()*2,life:1};
    }
    if(shootingStar){
      const s=shootingStar,tx=s.x-s.vx*8,ty=s.y-s.vy*8;
      const g=c.createLinearGradient(s.x,s.y,tx,ty);
      g.addColorStop(0,`rgba(255,255,255,${s.life})`);
      g.addColorStop(1,"rgba(255,255,255,0)");
      c.strokeStyle=g;c.lineWidth=1.4;
      c.beginPath();c.moveTo(s.x,s.y);c.lineTo(tx,ty);c.stroke();
      s.x+=s.vx;s.y+=s.vy;s.life-=.02;
      if(s.life<=0||s.x>w||s.y>h)shootingStar=null;
    }
  }else if(fxType==="sunny"){
    for(const p of particles){
      c.fillStyle=`rgba(255,235,150,${Math.min(1,p.a*1.7)})`;
      c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();
      p.x=(p.x+p.dx+w)%w;
      p.y=(p.y+p.dy+h)%h;
    }
  }else if(fxType==="snow"){
    c.fillStyle="rgba(255,255,255,.88)";
    for(const p of particles){
      c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();
      p.y+=p.dy;p.a+=.02;
      p.x+=Math.sin(p.a)*.35+p.dx;
      if(p.y>h+5){p.y=-5;p.x=Math.random()*w;}
    }
  }else if(fxType==="drizzle"||fxType==="rain"||fxType==="storm"){
    c.strokeStyle=fxType==="drizzle"?"rgba(174,219,255,.4)":"rgba(174,219,255,.58)";
    c.lineWidth=fxType==="drizzle"?1.1:1.6;
    c.beginPath();
    for(const p of particles){
      c.moveTo(p.x,p.y);
      c.lineTo(p.x-1,p.y+p.len);
      p.y+=p.s;p.x-=.6;
      if(p.y>h){p.y=-20;p.x=Math.random()*w;}
    }
    c.stroke();
  }else if(fxType==="fog"){
    for(const p of particles){
      const g=c.createLinearGradient(p.x,p.y,p.x+p.w,p.y);
      g.addColorStop(0,"rgba(200,220,240,0)");
      g.addColorStop(.5,`rgba(200,220,240,${Math.min(.35,p.a*2)})`);
      g.addColorStop(1,"rgba(200,220,240,0)");
      c.fillStyle=g;
      c.fillRect(p.x,p.y,p.w,p.h);
      p.x+=p.s;
      if(p.x>w)p.x=-p.w;
    }
  }

  if(fxType!=="none"&&!reducedMotion&&pageActive)rafId=requestAnimationFrame(drawFrame);
  else rafId=0;
}

function startCanvas(){
  if(!pageActive||reducedMotion||fxType==="none"||rafId||!canvasCtx)return;
  rafId=requestAnimationFrame(drawFrame);
}

function stopCanvas(){
  if(rafId){cancelAnimationFrame(rafId);rafId=0;}
  if(canvasCtx)canvasCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
}

function clearLightning(){
  if(lightningTimer){clearInterval(lightningTimer);lightningTimer=null;}
  if(lightningFlashTimer){clearTimeout(lightningFlashTimer);lightningFlashTimer=null;}
  document.querySelectorAll(".weather-lightning-flash").forEach(el=>el.remove());
}

function triggerLightning(){
  if(!pageActive||fxType!=="storm")return;
  const flash=document.createElement("div");
  flash.className="weather-lightning-flash";
  flash.style.cssText="position:fixed;inset:0;background:rgba(255,255,255,.28);z-index:3;pointer-events:none";
  document.body.appendChild(flash);
  if(lightningFlashTimer)clearTimeout(lightningFlashTimer);
  lightningFlashTimer=setTimeout(()=>{flash.remove();lightningFlashTimer=null;},90);
}

function startLightning(){
  if(!pageActive||reducedMotion||fxType!=="storm"||lightningTimer)return;
  lightningTimer=setInterval(()=>{if(Math.random()<.3)triggerLightning();},5000);
}

function setWeatherFX(code){
  clearLightning();
  lastWeatherCode=code;
  const night=isNightNow();

  if(code===0||code===1){
    fxType=night?"stars":"sunny";
  }else if(code===2){
    fxType=night?"stars":"none";
  }else if(code===3){
    fxType="none";
  }else if(code===45||code===48){
    fxType="fog";
  }else if(code>=51&&code<=57){
    fxType="drizzle";
  }else if((code>=61&&code<=67)||(code>=80&&code<=82)){
    fxType="rain";
  }else if((code>=71&&code<=77)||(code>=85&&code<=86)){
    fxType="snow";
  }else if(code>=95){
    fxType="storm";
  }else{
    fxType="none";
  }

  initParticles(fxType,particleCount(fxType));
  if(fxType==="none"){stopCanvas();return;}
  if(pageActive){
    if(rafId){cancelAnimationFrame(rafId);rafId=0;}
    startCanvas();
    startLightning();
  }else{
    stopCanvas();
  }
}

/* Khung tròn: phóng nội dung bên trong đến sát mép (tối đa 3×, không chạm viền) */
function fitBubbleContent(){
  const inner=$("bubbleInner"),bub=$("widgetShape");
  if(!inner||!bub)return;
  inner.style.transform="";
  inner.style.removeProperty("--bk");
  if(currentMode!=="bubble")return;

  const rects=()=>{
    const out=[];
    inner.querySelectorAll("*").forEach(el=>{
      if(el.namespaceURI!=="http://www.w3.org/1999/xhtml"||el.closest(".city-viewport"))return;
      if(el.classList.contains("city-container")||el.classList.contains("weather-icon")){
        out.push(el.getBoundingClientRect());return;
      }
      for(const n of el.childNodes){
        if(n.nodeType===3&&n.nodeValue.trim()){
          const r=document.createRange();
          r.selectNodeContents(n);
          out.push(r.getBoundingClientRect());
        }
      }
    });
    return out.filter(r=>r.width>0&&r.height>0);
  };
  const apply=k=>{inner.style.setProperty("--bk",k);inner.style.transform=`scale(${k})`;};
  const fits=k=>{
    apply(k);
    const b=bub.getBoundingClientRect();
    const R=Math.min(b.width,b.height)/2*0.93;
    const cx=b.left+b.width/2,cy=b.top+b.height/2;
    return rects().every(r=>[[r.left,r.top],[r.right,r.top],[r.left,r.bottom],[r.right,r.bottom]]
      .every(([x,y])=>Math.hypot(x-cx,y-cy)<=R));
  };

  if(!fits(1)){apply(1);return;}
  let lo=1,hi=3;
  for(let i=0;i<14;i++){
    const m=(lo+hi)/2;
    if(fits(m))lo=m;else hi=m;
  }
  apply(+lo.toFixed(3));
}

/* Đồng hồ + ngày tháng phía dưới khung tròn: phóng tối đa mà không làm khung tròn nhỏ lại */
function fitExternalBar(aw,ah){
  const bar=$("externalTimeBar"),stage=$("scaleStage"),widget=$("widgetShape");
  if(!bar)return;
  bar.style.setProperty("--bar-k",1);
  const baseH=bar.offsetHeight,bubbleH=widget.offsetHeight,w=stage.offsetWidth;
  if(!baseH||!w)return;
  let maxW=0;
  bar.querySelectorAll("div").forEach(d=>{
    const r=document.createRange();
    r.selectNodeContents(d);
    maxW=Math.max(maxW,r.getBoundingClientRect().width);
  });
  const s0=aw/w;                          // tỉ lệ khi bị giới hạn theo chiều rộng
  const roomH=ah/s0-bubbleH-6;            // chiều cao còn dư bên dưới khung tròn
  const kw=maxW?w*0.96/maxW:1,kh=roomH/baseH;
  const k=Math.max(1,Math.min(kw,kh,3));
  bar.style.setProperty("--bar-k",k.toFixed(3));
}

function updateCardScale(){
  const wrap=$("mainWrapper"),stage=$("scaleStage"),widget=$("widgetShape");
  if(!wrap||!stage||!widget)return;
  const cs=getComputedStyle(wrap);
  const aw=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(aw<120||ah<120){setTimeout(scheduleFit,500);return;} /* khung chưa ổn định, thử lại */

  stage.style.transform="none";            // luôn đo ở trạng thái sạch
  if(currentMode==="bubble")fitExternalBar(aw,ah);

  const fit=()=>{
    const el=currentMode==="card"?widget:stage;  // card: đo thẳng thẻ, không phụ thuộc phần tử ẩn
    const w=el.offsetWidth,h=el.offsetHeight;
    return w&&h?Math.min(aw/w,ah/h):0;
  };

  if(currentMode==="card"){
    /* Giờ dự báo: 6 cột hoặc 3 cột × 2 hàng, chọn cách cho chữ to hơn */
    let best=0,bestCols=6;
    for(const cols of [6,3]){
      widget.style.setProperty("--hcols",cols);
      const s=fit();
      if(s>best*1.001){best=s;bestCols=cols;}
    }
    widget.style.setProperty("--hcols",bestCols);
  }

  const s=Math.max(.35,Math.min(fit()||1,4));
  stage.style.transform=`scale(${s.toFixed(3)})`;
  fitBubbleContent();

    renderDebug(aw,ah,s);
}

function layoutWatchdog(force=false){

  ["orientationchange","focus","pageshow"].forEach(ev=>window.addEventListener(ev,refitBurst));

  if(window.visualViewport)window.visualViewport.addEventListener("resize",()=>layoutWatchdog(true));

/* Kính trong suốt: thanh trượt điều khiển độ đục nền, độ nhoè và độ bóng */
function applyOpacity(value){
  const transparency=Math.max(5,Math.min(95,Number(value)||80));
  const t=transparency/100;
  const root=document.documentElement.style;
  root.setProperty("--glass-fill",(0.015+(1-t)*0.30).toFixed(3));   // 80% → .075, 95% → .03
  root.setProperty("--glass-blur",(0.5+(1-t)*7).toFixed(1)+"px");   // 80% → 1.9px, 95% → 0.9px
  root.setProperty("--glass-sheen",(0.05+(1-t)*0.22).toFixed(3));   // 80% → .094
  setText("opacityValue",`${Math.round(transparency)}%`);
  safeStorageSet(OPACITY_KEYS[currentMode],String(transparency));
}

function loadOpacity(){
  const saved=Number(safeStorageGet(OPACITY_KEYS[currentMode]));
  const value=Number.isFinite(saved)&&saved>=5&&saved<=95?saved:80;
  $("opacitySlider").value=String(value);
  applyOpacity(value);
}

  const cloud='<path class="cloud-shape" d="M13 34h21a8 8 0 0 0 .5-16 12 12 0 0 0-23-1A8.5 8.5 0 0 0 13 34Z"/>';
  const moonShape='<g transform="translate(3.6 3.6) scale(1.7)"><path class="moon-core" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></g><path class="moon-star" d="M37 7v5M34.5 9.5h5"/><circle class="moon-dot" cx="9" cy="11" r="1.4"/>';
  if(night&&code===0)return `<svg viewBox="0 0 48 48" aria-hidden="true">${moonShape}</svg>`;

  if(code===0)return `<svg viewBox="0 0 48 48" aria-hidden="true">${sun}</svg>`;
  if(code===1)return `<svg viewBox="0 0 48 48" aria-hidden="true"><g transform="translate(-5 -5) scale(.78)">${sun}</g>${cloud}</svg>`;
  if(code===2||code===3||code===45||code===48)return `<svg viewBox="0 0 48 48" aria-hidden="true">${cloud}${(code===45||code===48)?'<path class="rain-line" d="M8 40h30M13 44h22"/>':''}</svg>`;
  if(code>=95)return `<svg viewBox="0 0 48 48" aria-hidden="true">${cloud}<path class="bolt" d="M25 27h-7l-4 10h7l-2 9 13-15h-8l3-4Z"/></svg>`;
  if((code>=71&&code<=77)||code===85||code===86)return `<svg viewBox="0 0 48 48" aria-hidden="true">${cloud}<g class="snowflake"><path d="M15 37v9m-4-4 8-1m-7-3 6 6M31 37v9m-4-4 8-1m-7-3 6 6"/></g></svg>`;

/* ===== DỮ LIỆU GIỜ / MƯA ===== */
function parseApiLocalTime(value){return typeof value==="string"?value.slice(0,16):"";}

function getCurrentVietnamHour(){
  return new Intl.DateTimeFormat("sv-SE",{timeZone:TIME_ZONE,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hourCycle:"h23"}).format(new Date()).replace(" ","T");
}

function findCurrentHourIndex(data){
  const times=data?.hourly?.time;
  if(!Array.isArray(times)||!times.length)return-1;
  const now=getCurrentVietnamHour().slice(0,13);
  let index=-1;
  for(let i=0;i<times.length;i++){
    if(typeof times[i]!=="string")continue;
    if(times[i].slice(0,13)<=now)index=i;else break;
  }
  return index;
}

function getNextHoursForecast(data){
  const times=data?.hourly?.time;
  const probs=data?.hourly?.precipitation_probability;
  if(!Array.isArray(times)||!Array.isArray(probs))return null;
  const index=findCurrentHourIndex(data);
  if(index<0)return null;
  const candidates=[];
  for(let n=1;n<=FORECAST_HOURS;n++){
    const i=index+n;
    if(i>=times.length)break;
    const raw=probs[i];
    if(raw===null||raw===undefined||raw==="")continue;
    const probability=Number(raw);
    if(!Number.isFinite(probability))continue;
    candidates.push({probability:Math.max(0,Math.min(100,probability)),time:parseApiLocalTime(times[i])});
  }
  if(!candidates.length)return null;
  const best=candidates.reduce((b,item)=>item.probability>b.probability?item:b);
  return{...best,coverage:candidates.length,expected:FORECAST_HOURS};
}

function formatHourRange(time){
  if(!time)return"Chưa có mốc dự báo";
  const hour=Number(time.slice(11,13));
  const minute=time.slice(14,16);
  if(!Number.isFinite(hour))return"Chưa có mốc dự báo";
  return`${time.slice(11,16)}–${String((hour+1)%24).padStart(2,"0")}:${minute}`;
}

function updateRainTheme(probability,hasData=true){
  let rainColor="#78909c";
  let message="Chưa có dữ liệu mưa";
  if(hasData&&isValidNumber(probability)){
    const value=Number(probability);
    rainColor="#4fc3f7";
    message="Trời trong / Mát mẻ";
    if(value>=80){rainColor="#00838f";message="🌦️ Mưa rào mùa hè nặng hạt";}
    else if(value>=60){rainColor="#00acc1";message="🌦️ Mưa dông mùa hè nhanh tạnh";}
    else if(value>=40){rainColor="#26c6da";message="🌤️ Mưa bóng mây / Thoáng qua";}
  }
  document.documentElement.style.setProperty("--rain-accent",rainColor);
  setText("rain-msg",message);
}

function updateTemperatureTheme(temp){
  if(!isValidNumber(temp))return;
  const t=Number(temp);
  const color=t>=38?"#e11d48":t>=32?"#f97316":t>=26?"#facc15":t>=20?"#34d399":t>=15?"#22d3ee":"#38bdf8";
  document.documentElement.style.setProperty("--temp-accent",color);
}

function renderHourly(data){
  const list=$("hourlyList");
  const times=data?.hourly?.time;
  const temps=data?.hourly?.temperature_2m;
  const probs=data?.hourly?.precipitation_probability;
  const codes=data?.hourly?.weather_code;
  if(!list)return;

  list.replaceChildren();
  const index=findCurrentHourIndex(data);
  if(index<0){list.textContent="Chưa có dữ liệu";return;}

  let rendered=0;
  for(let n=1;n<=6;n++){
    const i=index+n;
    if(!Array.isArray(times)||i>=times.length)break;
    const cc=toFiniteNumber(codes?.[i],-1);
    const condition=weatherDescription(cc);
    const hh=Number((times[i]||"").slice(11,13));
    const moonHour=(hh>=18||hh<5)&&(cc===0||cc===1);

    const item=document.createElement("div");
    item.className="hour-item";

    const time=document.createElement("span");
    time.className="hour-time";
    time.textContent=(times[i]||"").slice(11,16);

    const icon=document.createElement("span");
    icon.className="hour-icon";
    icon.textContent=moonHour?"🌙":condition.icon;

    const temp=document.createElement("span");
    temp.className="hour-temp";
    const temperature=toFiniteNumber(temps?.[i]);
    temp.textContent=temperature===null?"–":`${Math.round(temperature)}°`;

    const rain=document.createElement("span");
    rain.className="hour-rain";
    const probability=toFiniteNumber(probs?.[i]);
    rain.textContent=probability===null?"💧--":`💧${Math.round(probability)}%`;

    item.append(time,icon,temp,rain);
    list.appendChild(item);
    rendered++;
  }
  if(!rendered)list.textContent="Chưa có dữ liệu";
}

/* ===== CACHE ===== */
function readHourlyCache(){
  try{
    const raw=safeStorageGet(CACHE_KEY);
    if(!raw)return null;
    const data=JSON.parse(raw);
    if(!data||!Array.isArray(data.hourly))return null;
    return data;
  }catch(_){return null;}
}

function loadFromCache(){
  try{
    const data=readHourlyCache();
    if(!data)return;

    const fields=[["temp","temp"],["aqi-uv","aqiUvText"],["temp-range","tempRange"],["humidity","humidity"],["wind","wind"],["desc","desc"],["rain-pct","rainPct"],["rain-period","rainPeriod"],["rain-msg","rainMsg"],["updated","updated"]];
    for(const [elementId,key] of fields){
      if(data[key]!==undefined&&data[key]!==null)setText(elementId,data[key]);
    }

    const cacheAge=Date.now()-Number(data.savedAt||0);
    if(Number.isFinite(cacheAge)&&cacheAge>=0){
      const ageMin=Math.floor(cacheAge/60000);
      if(cacheAge>=CACHE_STALE_MS)setText("updated",`Dữ liệu cũ khoảng ${ageMin} phút · Đang làm mới`);
      else if(cacheAge>=CACHE_WARNING_MS)setText("updated",`Cache ${ageMin} phút · Có thể đã cũ`);
      else if(cacheAge>=CACHE_FRESH_MS)setText("updated",`Cache ${ageMin} phút · Đang làm mới`);
    }

    if(data.city)updateCityDisplay(data.city);

    if(Number.isFinite(data.weatherCode))renderMainIcon(data.weatherCode);

    const cachedTemperature=isValidNumber(data.temperatureValue)
      ?Number(data.temperatureValue)
      :parseFloat(String(data.temp||"").replace(/[^\d.-]/g,""));
    if(Number.isFinite(cachedTemperature))updateTemperatureTheme(cachedTemperature);

    if(data.rainKnown===true&&isValidNumber(data.rainProbability))updateRainTheme(data.rainProbability,true);
    else updateRainTheme(null,false);

    if(Number.isFinite(data.weatherCode))setWeatherFX(data.weatherCode);

    renderHourly({hourly:{
      time:data.hourly.map(i=>i.time),
      temperature_2m:data.hourly.map(i=>i.temperature),
      precipitation_probability:data.hourly.map(i=>i.probability),
      weather_code:data.hourly.map(i=>i.code)
    }});
    scheduleFit();
  }catch(_){}
}

function saveToCache(weatherCode,data,extra={}){
  try{
    const times=data?.hourly?.time||[];
    const temps=data?.hourly?.temperature_2m||[];
    const probs=data?.hourly?.precipitation_probability||[];
    const codes=data?.hourly?.weather_code||[];

    const hourly=[];
    for(let i=0;i<Math.min(times.length,48);i++){
      hourly.push({
        time:typeof times[i]==="string"?times[i]:"",

      });

    const cache={
      temp:$("temp").textContent,
      temperatureValue:extra.temperatureValue??null,
      aqiUvText:$("aqi-uv").textContent,
      tempRange:$("temp-range").textContent,
      humidity:$("humidity").textContent,
      wind:$("wind").textContent,
      desc:$("desc").textContent,
      rainPct:$("rain-pct").textContent,
      rainPeriod:$("rain-period").textContent,

/* ===== GỌI API ===== */
async function fetchWithTimeout(url,timeoutMs=12000,outerSignal=null){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  const onAbort=()=>controller.abort();
  if(outerSignal){
    if(outerSignal.aborted)controller.abort();
    else outerSignal.addEventListener("abort",onAbort,{once:true});
  }
  try{return await fetch(url,{signal:controller.signal,cache:"no-store"});}
  finally{clearTimeout(timer);outerSignal?.removeEventListener("abort",onAbort);}
}

function buildWeatherUrl(lat,lon){

    daily:"temperature_2m_min,temperature_2m_max",

    timezone:TIME_ZONE,
    forecast_days:"2",
    wind_speed_unit:"kmh"
  });
  return `https://api.open-meteo.com/v1/forecast?${params}`;
}

function buildAirQualityUrl(lat,lon){
  const params=new URLSearchParams({latitude:String(lat),longitude:String(lon),current:"us_aqi"});
  return `https://air-quality-api.open-meteo.com/v1/air-quality?${params}`;
}

async function requestWeatherData(lat,lon){
  const requestId=++weatherRequestSequence;
  const isStale=()=>requestId!==weatherRequestSequence;
  const controller=weatherAbortController=new AbortController();

  const results=await Promise.allSettled([
    fetchWithTimeout(buildWeatherUrl(lat,lon),12000,controller.signal),
    fetchWithTimeout(buildAirQualityUrl(lat,lon),9000,controller.signal)
  ]);
  if(isStale())return{ignored:true,requestId};

  const weatherResult=results[0];
  if(weatherResult.status!=="fulfilled"||!weatherResult.value.ok)throw new Error("Weather API unavailable");

  let data;
  try{data=await weatherResult.value.json();}
  catch(e){if(isStale())return{ignored:true,requestId};throw e;}
  if(!data||!data.current)throw new Error("Missing current weather");

  let aqi="--";
  const airResult=results[1];
  if(airResult.status==="fulfilled"&&airResult.value.ok){
    try{
      const airData=await airResult.value.json();
      const rawAQI=airData?.current?.us_aqi;
      if(isValidNumber(rawAQI))aqi=Math.round(Number(rawAQI));
    }catch(_){}
  }

  if(isStale()||!pageActive||!isStillCurrentLocation(lat,lon))return{ignored:true,requestId};

  const current=data.current;
  const temperature=toFiniteNumber(current.temperature_2m);
  const humidity=toFiniteNumber(current.relative_humidity_2m);
  const wind=toFiniteNumber(current.wind_speed_10m);
  const code=toFiniteNumber(current.weather_code);
  const uvCurrent=toFiniteNumber(current.uv_index);
  const uvHourly=toFiniteNumber(data.hourly?.uv_index?.[findCurrentHourIndex(data)]);
  const uvValue=uvCurrent===null?uvHourly:uvCurrent;
  const uv=uvValue===null?"--":Math.round(uvValue);

  /* is_day phải được gán TRƯỚC setWeatherFX và renderMainIcon */
  lastIsDay=current.is_day===1?true:current.is_day===0?false:null;

  setText("aqi-uv",`AQI: ${aqi} · UV: ${uv}`);

  const min=toFiniteNumber(data.daily?.temperature_2m_min?.[0]);
  const max=toFiniteNumber(data.daily?.temperature_2m_max?.[0]);
  setText("temp-range",`${min===null?"--":Math.round(min)}° / ${max===null?"--":Math.round(max)}°`);
  setText("temp",temperature===null?"--°":`${Math.round(temperature)}°`);
  if(temperature!==null)updateTemperatureTheme(temperature);

  setText("humidity",humidity===null?"--%":`${Math.round(humidity)}%`);
  setText("wind",wind===null?"--":Math.round(wind));

  const condition=weatherDescription(code===null?-1:code);
  setText("desc",condition.text);
  renderMainIcon(code===null?-1:code);
  if(code!==null)setWeatherFX(code);

  const rain=getNextHoursForecast(data);
  let rainKnown=false,rainProbability=null;
  if(rain){
    rainKnown=true;
    rainProbability=rain.probability;
    setText("rain-pct",`${Math.round(rain.probability)}%`);
    setText("rain-period",`${rain.coverage<rain.expected?`Dữ liệu ${rain.coverage}/${rain.expected} giờ · `:""}Cao nhất: ${formatHourRange(rain.time)}`);
    updateRainTheme(rain.probability,true);
  }else{
    setText("rain-pct","--%");
    setText("rain-period","Không có dữ liệu dự báo");
    updateRainTheme(null,false);
  }

  renderHourly(data);
  $("widgetShape").classList.remove("error");

  const stamp=new Intl.DateTimeFormat("vi-VN",{timeZone:TIME_ZONE,hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit",hourCycle:"h23"}).format(new Date());
  setText("updated",`Cập nhật ${stamp}`);
  window.lastWeatherFetchAt=Date.now();

  saveToCache(code,data,{temperatureValue:temperature,rainKnown,rainProbability});
  lastWeatherSuccessAt=Date.now();
  weatherFailureCount=0;
  if(weatherRetryTimer){clearTimeout(weatherRetryTimer);weatherRetryTimer=null;}

  scheduleFit();
  return{ignored:false,requestId};
}

/* ===== HÀNG ĐỢI LÀM MỚI ===== */
function schedulePendingLocationRefresh(lat,lon){
  pendingLocationCandidate={latitude:Number(lat),longitude:Number(lon)};
  if(pendingLocationRefreshTimer)clearTimeout(pendingLocationRefreshTimer);
  const delay=Math.max(0,WEATHER_MIN_FETCH_INTERVAL_MS-(Date.now()-lastWeatherRequestAt));
  pendingLocationRefreshTimer=setTimeout(()=>{
    pendingLocationRefreshTimer=null;
    const target=pendingLocationCandidate;
    pendingLocationCandidate=null;
    if(!pageActive||!target||!currentLocation)return;
    if(distanceMeters(target.latitude,target.longitude,currentLocation.latitude,currentLocation.longitude)<100){
      queueWeatherRefresh(currentLocation.latitude,currentLocation.longitude,false);
    }
  },delay);
}

function shouldFetchForLocation(lat,lon,force=false){
  if(force)return true;
  if(!lastWeatherRequestLocation)return true;
  const moved=distanceMeters(lat,lon,lastWeatherRequestLocation.latitude,lastWeatherRequestLocation.longitude);
  if(moved<WEATHER_LOCATION_MIN_DISTANCE)return false;
  return Date.now()-lastWeatherRequestAt>=WEATHER_MIN_FETCH_INTERVAL_MS;
}

function queueWeatherRefresh(lat,lon,force=false){
  /* Vị trí nhảy xa khi đang tải: huỷ request cũ, nhận request mới ngay */
  if(weatherQueueRunning&&weatherAbortController&&lastWeatherRequestLocation&&
     distanceMeters(lat,lon,lastWeatherRequestLocation.latitude,lastWeatherRequestLocation.longitude)>=WEATHER_LOCATION_MIN_DISTANCE){
    weatherRequestSequence++;
    lastWeatherRequestAt=0;
    weatherAbortController.abort();
  }

  const previous=pendingWeatherLocation;
  pendingWeatherLocation={latitude:Number(lat),longitude:Number(lon),force:!!force||(previous?.force===true)};

  if(weatherQueueRunning)return;
  weatherQueueRunning=true;

  (async()=>{
    try{
      while(pendingWeatherLocation&&pageActive){
        const target=pendingWeatherLocation;
        pendingWeatherLocation=null;

        if(!isStillCurrentLocation(target.latitude,target.longitude))continue;
        if(!shouldFetchForLocation(target.latitude,target.longitude,target.force))continue;

        lastWeatherRequestAt=Date.now();
        lastWeatherRequestLocation={latitude:target.latitude,longitude:target.longitude};

        try{
          await requestWeatherData(target.latitude,target.longitude);
        }catch(error){
          if(isStillCurrentLocation(target.latitude,target.longitude)){
            $("widgetShape").classList.add("error");
            setText("rain-msg","Mất kết nối · Đang dùng dữ liệu cũ");
            setText("updated","Lỗi mạng · Sẽ tự thử lại");
            if(weatherRetryTimer)clearTimeout(weatherRetryTimer);
            weatherFailureCount=Math.min(5,weatherFailureCount+1);
            const retryDelay=Math.min(5*60*1000,WEATHER_RETRY_BASE_MS*Math.pow(2,weatherFailureCount-1));
            weatherRetryTimer=setTimeout(()=>{
              weatherRetryTimer=null;
              if(pageActive&&currentLocation)queueWeatherRefresh(currentLocation.latitude,currentLocation.longitude,true);
            },retryDelay);
          }
        }
      }
    }finally{
      weatherQueueRunning=false;
      if(pendingWeatherLocation&&pageActive){
        const next=pendingWeatherLocation;
        pendingWeatherLocation=null;
        queueWeatherRefresh(next.latitude,next.longitude,next.force);
      }
    }
  })();
}

/* ===== TÊN ĐỊA ĐIỂM (REVERSE GEOCODE) ===== */
function formatAdminUnit(value){
  return String(value||"").trim()
    .replace(/^thành phố\s+/i,"TP. ")
    .replace(/^tỉnh\s+/i,"T. ")
    .replace(/^quận\s+/i,"Q. ")
    .replace(/^huyện\s+/i,"H. ")
    .replace(/^thị xã\s+/i,"TX. ")
    .replace(/^phường\s+/i,"P. ")
    .replace(/^xã\s+/i,"X. ")
    .replace(/^thị trấn\s+/i,"TT. ");
}

async function fetchCityName(lat,lon){
  if(!pageActive)return;
  const now=Date.now();
  const moved=!lastReverseGeocodePosition||
    distanceMeters(lat,lon,lastReverseGeocodePosition.latitude,lastReverseGeocodePosition.longitude)>=REVERSE_GEOCODE_MIN_DISTANCE;
  if(!moved&&now-lastReverseGeocodeAt<REVERSE_GEOCODE_MIN_INTERVAL)return;
  if(reverseGeocodeInFlight){pendingReverseGeocode={latitude:lat,longitude:lon};return;}

  const wait=Math.max(0,REVERSE_GEOCODE_MIN_INTERVAL-(now-lastReverseGeocodeAt));
  if(lastReverseGeocodeAt>0&&wait>0){
    pendingReverseGeocode={latitude:lat,longitude:lon};
    if(reverseGeocodeTimer)clearTimeout(reverseGeocodeTimer);
    reverseGeocodeTimer=setTimeout(()=>{
      reverseGeocodeTimer=null;
      const next=pendingReverseGeocode;
      pendingReverseGeocode=null;
      if(next&&pageActive)fetchCityName(next.latitude,next.longitude);
    },wait);
    return;
  }

  reverseGeocodeInFlight=true;
  const sequence=++reverseGeocodeSequence;
  try{
    const params=new URLSearchParams({format:"jsonv2",lat:String(lat),lon:String(lon),zoom:"14",addressdetails:"1","accept-language":"vi"});
    const response=await fetchWithTimeout(`https://nominatim.openstreetmap.org/reverse?${params}`,10000);
    if(!response.ok)throw new Error("Reverse geocoding failed");

    const result=await response.json();
    if(sequence!==reverseGeocodeSequence)return;
    if(!isStillCurrentLocation(lat,lon))return;

    const address=result.address||{};
    const wardOrCommune=address.ward||address.quarter||address.suburb||address.village||address.hamlet||address.neighbourhood||"";
    const provinceOrCity=address.province||address.state||address.city||address.town||address.municipality||address.county||"";

    let displayName="";
    if(wardOrCommune&&provinceOrCity&&wardOrCommune!==provinceOrCity)displayName=`${formatAdminUnit(wardOrCommune)}, ${formatAdminUnit(provinceOrCity)}`;
    else if(provinceOrCity)displayName=formatAdminUnit(provinceOrCity);
    else if(wardOrCommune)displayName=formatAdminUnit(wardOrCommune);
    else if(result.name)displayName=formatAdminUnit(result.name);
    else displayName=DEFAULT_LOCATION.name;

    if(currentLocation)currentLocation.name=displayName;
    updateCityDisplay(displayName);

    const cached=readHourlyCache();
    if(cached){cached.city=displayName;safeStorageSet(CACHE_KEY,JSON.stringify(cached));}

    lastReverseGeocodeAt=Date.now();
    lastReverseGeocodePosition={latitude:lat,longitude:lon};
  }catch(_){
    lastReverseGeocodeAt=Date.now();
    const cached=readHourlyCache();
    if($("cityText")?.textContent==="Đang tải địa điểm...")updateCityDisplay(cached?.city||DEFAULT_LOCATION.name);
  }finally{
    reverseGeocodeInFlight=false;
    if(pendingReverseGeocode&&pageActive&&!reverseGeocodeTimer){
      const next=pendingReverseGeocode;
      pendingReverseGeocode=null;
      const delay=Math.max(0,REVERSE_GEOCODE_MIN_INTERVAL-(Date.now()-lastReverseGeocodeAt));
      reverseGeocodeTimer=setTimeout(()=>{
        reverseGeocodeTimer=null;
        if(pageActive)fetchCityName(next.latitude,next.longitude);
      },delay);
    }
  }
}

/* ===== VỊ TRÍ ===== */
function useFallbackLocation(reason){
  currentLocation={latitude:DEFAULT_LOCATION.latitude,longitude:DEFAULT_LOCATION.longitude,name:DEFAULT_LOCATION.name};
  const cached=readHourlyCache();
  updateCityDisplay(cached?.city||DEFAULT_LOCATION.name);
  if(reason)setText("updated",reason);
  queueWeatherRefresh(currentLocation.latitude,currentLocation.longitude,true);
  fetchCityName(currentLocation.latitude,currentLocation.longitude);
}

function refreshForCurrentLocation(force=false){
  if(!currentLocation||!pageActive)return;
  queueWeatherRefresh(currentLocation.latitude,currentLocation.longitude,force);
  if(!force&&lastWeatherRequestLocation){
    const moved=distanceMeters(currentLocation.latitude,currentLocation.longitude,lastWeatherRequestLocation.latitude,lastWeatherRequestLocation.longitude);
    if(moved>=WEATHER_LOCATION_MIN_DISTANCE&&Date.now()-lastWeatherRequestAt<WEATHER_MIN_FETCH_INTERVAL_MS){
      schedulePendingLocationRefresh(currentLocation.latitude,currentLocation.longitude);
    }
  }
}

/* Native (Swift) gọi hàm này để đẩy toạ độ vào */
window.setCarPlayLocation=function(lat,lon){
  lat=Number(lat);lon=Number(lon);
  if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;
  const movedFromWeatherAnchor=!lastWeatherRequestLocation||
    distanceMeters(lat,lon,lastWeatherRequestLocation.latitude,lastWeatherRequestLocation.longitude)>=WEATHER_LOCATION_MIN_DISTANCE;
  currentLocation={latitude:lat,longitude:lon,name:currentLocation?.name||""};
  geoRequestSequence++;
  if(geoSafetyTimer){clearTimeout(geoSafetyTimer);geoSafetyTimer=null;}
  geoInFlight=false;
  if(movedFromWeatherAnchor)refreshForCurrentLocation(false);
  fetchCityName(lat,lon);
};

function getLocationAndWeather(){
  if(!pageActive||geoInFlight)return;
  if(!navigator.geolocation){
    if(!currentLocation)useFallbackLocation("GPS không khả dụng");
    else refreshForCurrentLocation(false);
    return;
  }

  setText("updated","Đang định vị GPS...");
  geoInFlight=true;
  const requestSequence=++geoRequestSequence;
  let resolved=false;

  geoSafetyTimer=setTimeout(()=>{
    if(resolved||requestSequence!==geoRequestSequence)return;
    geoInFlight=false;
    geoSafetyTimer=null;
    if(!currentLocation)useFallbackLocation("GPS chậm · Dùng vị trí mặc định");
    else refreshForCurrentLocation(false);
  },6500);

  navigator.geolocation.getCurrentPosition(
    position=>{
      if(resolved||requestSequence!==geoRequestSequence)return;
      resolved=true;
      geoInFlight=false;
      if(geoSafetyTimer){clearTimeout(geoSafetyTimer);geoSafetyTimer=null;}
      const lat=position.coords.latitude,lon=position.coords.longitude;
      currentLocation={latitude:lat,longitude:lon,name:currentLocation?.name||""};
      refreshForCurrentLocation(false);
      fetchCityName(lat,lon);
    },
    ()=>{
      if(resolved||requestSequence!==geoRequestSequence)return;
      resolved=true;
      geoInFlight=false;
      if(geoSafetyTimer){clearTimeout(geoSafetyTimer);geoSafetyTimer=null;}
      if(!currentLocation)useFallbackLocation("Chưa cấp quyền GPS · Dùng vị trí mặc định");
      else refreshForCurrentLocation(false);
    },
    {enableHighAccuracy:false,timeout:5500,maximumAge:5*60*1000}
  );
}

/* ===== LÀM MỚI ===== */
function refreshData(){
  if(Date.now()-lastManualRefresh<30000)return;
  lastManualRefresh=Date.now();
  setText("updated","Đang làm mới dữ liệu...");
  if(currentLocation){
    refreshForCurrentLocation(true);
    fetchCityName(currentLocation.latitude,currentLocation.longitude);
  }else{
    getLocationAndWeather();
  }
}

function startPeriodicRefresh(){
  if(!pageActive)return;
  if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;}
  refreshTimer=setInterval(()=>{
    if(!pageActive||document.hidden)return;
    if(currentLocation)refreshForCurrentLocation(true);
    getLocationAndWeather();
  },REFRESH_INTERVAL_MS);
}

function resumeIfStale(){
  if(!currentLocation){getLocationAndWeather();return;}
  if(Date.now()-(window.lastWeatherFetchAt||0)>5*60*1000){
    refreshForCurrentLocation(true);
    getLocationAndWeather();
  }
}

function handleVisibility(){
  pageActive=!document.hidden;
  if(pageActive){
    document.body.classList.remove("page-paused");
    startPeriodicRefresh();
    startClock();
    startAuraTimer();
    startCanvas();
    startLightning();
    resumeIfStale();
  }else{
    document.body.classList.add("page-paused");
    if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;}
    stopClock();
    stopAuraTimer();
    stopCanvas();
    clearLightning();
  }
}

document.addEventListener("visibilitychange",handleVisibility);

window.addEventListener("pagehide",()=>{
  pageActive=false;
  document.body.classList.add("page-paused");
  if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;}
  if(pendingLocationRefreshTimer){clearTimeout(pendingLocationRefreshTimer);pendingLocationRefreshTimer=null;}
  if(reverseGeocodeTimer){clearTimeout(reverseGeocodeTimer);reverseGeocodeTimer=null;}
  if(weatherRetryTimer){clearTimeout(weatherRetryTimer);weatherRetryTimer=null;}
  stopCanvas();
  clearLightning();
  stopClock();
  stopAuraTimer();
  if(geoSafetyTimer){clearTimeout(geoSafetyTimer);geoSafetyTimer=null;}
  geoRequestSequence++;
  geoInFlight=false;
  reverseGeocodeSequence++;
});

window.addEventListener("pageshow",()=>{
  pageActive=!document.hidden;
  if(!pageActive)return;
  document.body.classList.remove("page-paused");
  startPeriodicRefresh();
  startClock();
  startAuraTimer();
  startCanvas();
  startLightning();
  resumeIfStale();
});

/* ===== KHỞI ĐỘNG ===== */
function startWeatherWidget(){
  loadSavedLayout();
  loadFromCache();
  updateAmbianceAura();
  startAuraTimer();
  startClock();
  resizeCanvas();
  startCanvas();
  initScaleObserver();
  startLayoutWatchdog();
  setDebug(debugOn);
  $("widgetShape").addEventListener("click",refreshData);
  getLocationAndWeather();
  startPeriodicRefresh();
}

startWeatherWidget();
window.refreshWeatherWidget=refreshData;
</script>
