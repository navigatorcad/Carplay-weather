<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Weather CarPlay Widget - Perfect Centered Balance</title>
<style>
:root{
  --accent:#90caf9;
  --accent-rgb:144,202,249;
  --text:#f8fafc;
  --muted:#aebdce;
  --surface-opacity:.45;
  --glass-specular:.22;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;min-height:100%;overflow-y:auto;overflow-x:hidden;background:#050811;color:var(--text)}
body{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:16px 12px;position:relative;isolation:isolate;min-height:100vh}

/* KHÔNG GIAN NỀN ĐỘNG AURA */
.aura-bg{position:fixed;inset:0;pointer-events:none;z-index:0;transition:opacity 2s}
.aura-orb{position:absolute;border-radius:50%;filter:blur(75px);opacity:.45;animation:floatAura 15s ease-in-out infinite alternate}
.orb-1{width:320px;height:320px;top:-10%;left:-10%;background:rgba(var(--accent-rgb),.5)}
.orb-2{width:360px;height:360px;bottom:-15%;right:-10%;background:rgba(59,130,246,.35);animation-delay:-5s}
@keyframes floatAura{to{transform:translate(35px,45px) scale(1.18)}}
body.aura-dawn{background:radial-gradient(circle at 50% 30%,#38213d 0%,#1a1124 60%,#08060c 100%)}
body.aura-noon{background:radial-gradient(circle at 50% 30%,#193563 0%,#0c1830 60%,#03060c 100%)}
body.aura-sunset{background:radial-gradient(circle at 50% 30%,#4d2132 0%,#24101f 60%,#0a0408 100%)}
body.aura-night{background:radial-gradient(circle at 50% 30%,#0e1424 0%,#060912 60%,#010204 100%)}

.weather-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* CÂN CHỈNH LAYOUT CHÍNH GIỮA, CÓ KHOẢNG ĐỆM ĐỂ KHÔNG BỊ TRỐNG PHẦN TRÊN */
.main-wrapper{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;width:100%;margin:auto;flex:1}
.widget-container{display:flex;justify-content:center;align-items:center;perspective:1000px;width:100%}

/* HIỆU ỨNG LIQUID GLASS */
.bubble,.card{
  background:
    radial-gradient(120% 100% at 15% 0%, rgba(255, 255, 255, var(--glass-specular)) 0%, rgba(255, 255, 255, 0.03) 45%, transparent 75%),
    linear-gradient(160deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(0, 0, 0, 0.25) 100%),
    rgba(14, 22, 36, var(--surface-opacity));
  backdrop-filter: blur(24px) saturate(185%) brightness(1.08);
  -webkit-backdrop-filter: blur(24px) saturate(185%) brightness(1.08);
  border: 2.5px solid rgba(var(--accent-rgb), 0.85);
  box-shadow:
    0 18px 40px rgba(0, 0, 0, 0.55),
    0 0 28px rgba(var(--accent-rgb), 0.45),
    inset 0 1.5px 1.5px rgba(255, 255, 255, 0.55),
    inset 0 -2px 6px rgba(0, 0, 0, 0.45),
    inset 0 0 22px rgba(var(--accent-rgb), 0.22);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  position:relative;
  transition:border-color .4s,box-shadow .4s;
  overflow:hidden;
  cursor:pointer;
}

.bubble::before, .card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(125deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.05) 28%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}

.bubble > *, .card > * {
  position: relative;
  z-index: 1;
}

/* Form Tròn: Chuẩn 1:1 */
.bubble{
  width: min(320px, 94vw);
  aspect-ratio: 1/1;
  border-radius: 50%;
  justify-content: center;
  padding: 18px 14px;
  gap: 2px;
}

/* Form Chữ nhật: Mở rộng bề ngang tối ưu, thu hẹp khoảng cách thừa, phóng to chữ từ xa */
.card{
  width: min(340px, 94vw);
  height: auto;
  min-height: 500px;
  border-radius: 28px;
  justify-content: space-between;
  padding: 18px 14px;
  gap: 8px;
}

.bubble:active,.card:active{transform:scale(.985)}

.city-container{display:flex;align-items:center;max-width:90%;overflow:hidden;font-size:15px;font-weight:700;color:#f1f5f9;text-shadow:0 1px 3px rgba(0,0,0,0.45);position:relative;flex-shrink:0}
.city-pin{flex-shrink:0;margin-right:4px}
.city-viewport{overflow:hidden;width:100%;position:relative;white-space:nowrap}
.city-track{display:inline-block;white-space:nowrap}
.city-track.marquee-active{display:inline-flex;animation:smoothScroll 14s linear infinite}
.city-text{display:inline-block;white-space:nowrap}
@keyframes smoothScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* PHẦN THỜI GIAN & NGÀY CHO KHUNG CHỮ NHẬT (TO RÕ, RẤT DỄ NHÌN TỪ XA) */
.card-time-block{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.card-time-block .clock-text{font-size:28px;font-weight:850;color:var(--accent);text-shadow:0 0 14px rgba(var(--accent-rgb),.8);letter-spacing:1px}
.card-time-block .solar-date{font-size:14px;font-weight:700;color:#f1f5f9;text-shadow:0 1px 3px rgba(0,0,0,0.45)}
.card-time-block .lunar-date{font-size:13px;font-weight:700;color:#ffd54f;text-shadow:0 1px 3px rgba(0,0,0,0.45)}

/* Thanh thời gian dùng cho khung tròn */
.external-time-bar{display:none;width:min(320px, 94vw);margin-top:10px;text-align:center;flex-direction:column;align-items:center;gap:3px}
.external-time-bar .clock-text{font-size:23px;font-weight:900;color:#fff;width:100%;text-shadow:0 0 8px var(--accent),0 0 16px var(--accent);letter-spacing:.5px;white-space:nowrap}
.external-time-bar .solar-date,.external-time-bar .lunar-date{font-size:12px;font-weight:750;width:100%;white-space:nowrap}
.external-time-bar .solar-date{color:#f1f5f9;text-shadow:0 0 5px var(--accent)}
.external-time-bar .lunar-date{color:#ffe082;text-shadow:0 0 5px #ffd54f}

.main-temp{display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0}
.temp{font-size:52px;line-height:1;font-weight:800;letter-spacing:-2px;text-shadow:0 2px 10px rgba(0,0,0,0.35)}
.weather-icon{font-size:38px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,0.35))}
.desc{color:#e2e8f0;font-size:15px;font-weight:600;max-width:95%;flex-shrink:0;text-shadow:0 1px 3px rgba(0,0,0,0.4)}
.aqi-uv{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.3px;flex-shrink:0}
.temp-range{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.5px}

.divider{width:92%;height:1px;background:linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);margin:5px 0;flex-shrink:0}
.details{display:flex;justify-content:space-around;align-items:center;width:95%;flex-shrink:0}
.detail-box{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.detail-val{display:flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:800;white-space:nowrap}
.detail-icon{font-size:19px;line-height:1}
.detail-unit{font-size:12px;font-weight:600;color:#cbd5e1;margin-left:1px}
.detail-lbl{font-size:12px;color:var(--muted);font-weight:600}
.vertical-divider{width:1px;height:30px;background:linear-gradient(180deg, transparent, rgba(255,255,255,.32), transparent)}

.rain-section{width:100%;flex-shrink:0}
.rain-prob{display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px;font-weight:650;white-space:nowrap}
.rain-icon{font-size:18px}
.rain-prob strong{font-size:18px;font-weight:850;color:var(--accent)}
.rain-period{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;font-weight:600}
.rain-alert{font-size:11px;font-weight:700;margin-top:2px;color:var(--accent);white-space:nowrap}
.updated{width:100%;color:#94a3b8;font-size:9px;opacity:.95;flex-shrink:0;font-weight:600}

.hourly-section{display:none;width:100%;margin-top:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.22);flex-shrink:0}
.card .hourly-section{display:block}
.hourly-title{font-size:11px;color:var(--muted);font-weight:750;margin-bottom:5px;text-align:left}
.hourly-list{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.hour-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:6px 2px;border-radius:10px;
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
}
.hour-time{font-size:10px;color:#e2e8f0;font-weight:650}
.hour-icon{font-size:16px;line-height:1.2}
.hour-temp{font-size:12px;font-weight:800}
.hour-rain{font-size:9px;color:#90caf9;font-weight:700}

/* CỤM ĐIỀU KHIỂN: XẾP DỌC, CĂN GIỮA, ĐẶT DƯỚI NÚT ĐỔI FORM, KHÔNG BỊ TRÀN VIỀN */
.mode-controls{
  width:100%;
  max-width:320px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  margin:12px auto 0 auto;
  flex-shrink:0;
  z-index:9999;
}
.mode-toggle-btn{
  width:100%;
  background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(20,30,45,.75));
  border:1.5px solid rgba(var(--accent-rgb),.8);
  color:#fff;font-size:13px;font-weight:750;padding:10px 14px;border-radius:16px;cursor:pointer;
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.4);
  text-align:center;
}
.opacity-control{
  width:100%;
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  border:1.5px solid rgba(var(--accent-rgb),.65);border-radius:16px;
  background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(20,30,45,.7));
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.35);
  color:#fff;font-size:11px;
}
.opacity-control label{white-space:nowrap;color:#e0f2fe;font-weight:700}
.opacity-control input{flex:1;min-width:40px;accent-color:var(--accent);height:20px;cursor:pointer}
.opacity-value{width:32px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}

.level-low{--accent:#90caf9;--accent-rgb:144,202,249}
.level-mild{--accent:#ffd54f;--accent-rgb:255,213,79}
.level-warn{--accent:#ff9800;--accent-rgb:255,152,0}
.level-high{--accent:#ff453a;--accent-rgb:255,69,58}
.level-low,.level-mild,.level-warn,.level-high{
  border-color:rgba(var(--accent-rgb),.88);
  box-shadow:
    0 18px 40px rgba(0, 0, 0, 0.55),
    0 0 28px rgba(var(--accent-rgb), 0.55),
    inset 0 1.5px 1.5px rgba(255, 255, 255, 0.55),
    inset 0 -2px 6px rgba(0, 0, 0, 0.45),
    inset 0 0 22px rgba(var(--accent-rgb), 0.25);
}

.error .desc{color:#ffb4ab}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="aura-bg"><div class="aura-orb orb-1"></div><div class="aura-orb orb-2"></div></div>
<canvas class="weather-fx" id="weatherFxCanvas"></canvas>

<div class="main-wrapper">
 <div class="widget-container">
  <main class="bubble level-low" id="widgetShape" aria-live="polite">
   <div class="city-container">
    <span class="city-pin">📍</span>
    <div class="city-viewport" id="cityViewport">
     <div class="city-track" id="cityTrack">
      <span class="city-text" id="cityText">Đang xác định vị trí...</span>
     </div>
    </div>
   </div>

   <div class="card-time-block" id="cardTimeBlock" style="display:none">
    <div class="clock-text" id="cardClock">--:--:--</div>
    <div class="solar-date" id="cardSolar">--</div>
    <div class="lunar-date" id="cardLunar">--</div>
   </div>

   <div class="main-temp">
    <div class="temp" id="temp">--°</div>
    <div class="weather-icon" id="weather-icon">⛅</div>
   </div>

   <div class="desc" id="desc">Đang tải thời tiết...</div>
   <div class="aqi-uv" id="aqi-uv">AQI: -- · UV: --</div>
   <div class="temp-range" id="temp-range">--° / --°</div>
   <div class="divider"></div>

   <div class="details">
    <div class="detail-box">
     <div class="detail-val"><span class="detail-icon">💧</span><span id="humidity">--%</span></div>
     <div class="detail-lbl">Độ ẩm</div>
    </div>
    <div class="vertical-divider"></div>
    <div class="detail-box">
     <div class="detail-val"><span class="detail-icon">💨</span><span id="wind">--</span><small class="detail-unit">km/h</small></div>
     <div class="detail-lbl">Tốc độ gió</div>
    </div>
   </div>

   <div class="divider"></div>

   <section class="rain-section">
    <div class="rain-prob">
     <span class="rain-icon">🌧️</span>
     <span>Mưa 3 giờ tới</span>
     <strong id="rain-pct">--%</strong>
    </div>
    <div class="rain-period" id="rain-period">Đang lấy dự báo...</div>
    <div class="rain-alert" id="rain-msg">Đang cập nhật</div>
   </section>

   <section class="hourly-section" id="hourlySection">
    <div class="hourly-title">DỰ BÁO THEO GIỜ</div>
    <div class="hourly-list" id="hourlyList">
     <span class="hour-time">Đang tải...</span>
    </div>
   </section>

   <div class="updated" id="updated">Đang kết nối dữ liệu...</div>
  </main>
 </div>

 <div class="external-time-bar" id="externalTimeBar">
  <div class="clock-text" id="extClock">--:--:--</div>
  <div class="solar-date" id="extSolar">--</div>
  <div class="lunar-date" id="extLunar">--</div>
 </div>
</div>

<!-- CỤM ĐIỀU KHIỂN ĐÃ ĐƯỢC CHUYỂN XUỐNG DƯỚI, CÂN ĐỐI VÀ KHÔNG BỊ TRÀN VIỀN -->
<div class="mode-controls">
  <button class="mode-toggle-btn" id="modeToggleBtn" type="button">🔄 Đổi Form</button>
  <div class="opacity-control">
    <label for="opacitySlider">Độ trong suốt</label>
    <input id="opacitySlider" type="range" min="5" max="95" step="1" value="45">
    <span class="opacity-value" id="opacityValue">45%</span>
  </div>
</div>

<script>
"use strict";

const DEFAULT_LOCATION={latitude:20.5453,longitude:105.9122,name:"Phủ Lý (mặc định)"};
const REFRESH_INTERVAL_MS=15*60*1000;
const FORECAST_HOURS=3;
const TIME_ZONE="Asia/Ho_Chi_Minh";
const CACHE_KEY="carplay_weather_cache_v30";
const LAYOUT_KEY="carplay_layout_mode_v17";
const OPACITY_KEYS={bubble:"carplay_opacity_bubble_v24",card:"carplay_opacity_card_v24"};
const $=id=>document.getElementById(id);

let currentLocation=null;
let lastReverseGeocodeAt=0;
let refreshTimer=null;
let clockTimer=null;
let auraTimer=null;
let currentMode="bubble";
let refreshInFlight=false;
let geoInFlight=false;
let geoSafetyTimer=null;
let fxType="none";
let particles=[];
let rafId=0;
let lightningTimer=null;
let canvasCtx=null;
let lastWeatherCode=null;
let lastLocationKey="";
let pageActive=!document.hidden;

const reducedMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function safeStorageGet(key){
 try{return localStorage.getItem(key)}catch(_){return null}
}
function safeStorageSet(key,value){
 try{localStorage.setItem(key,value)}catch(_){}
}
function setText(id,value){
 const el=$(id);
 if(el)el.textContent=value;
}

function updateAmbianceAura(){
 const h=Number(new Intl.DateTimeFormat("en-US",{
  timeZone:TIME_ZONE,hour:"2-digit",hourCycle:"h23"
 }).format(new Date()));

 document.body.classList.remove("aura-dawn","aura-noon","aura-sunset","aura-night");
 document.body.classList.add(
  h>=5&&h<8?"aura-dawn":
  h>=8&&h<17?"aura-noon":
  h>=17&&h<19?"aura-sunset":"aura-night"
 );
}

function updateCityDisplay(name){
 const track=$("cityTrack");
 const viewport=$("cityViewport");
 if(!track||!viewport)return;

 track.className="city-track";
 track.replaceChildren();

 const first=document.createElement("span");
 first.className="city-text";
 first.textContent=String(name||"Vị trí hiện tại");
 track.appendChild(first);

 requestAnimationFrame(()=>{
  if(!pageActive)return;
  const w=first.getBoundingClientRect().width;

  if(w>viewport.clientWidth+2){
   const second=document.createElement("span");
   second.className="city-text";
   second.textContent=String(name||"Vị trí hiện tại");
   second.style.paddingLeft="40px";
   track.appendChild(second);
   track.classList.add("marquee-active");
  }
 });
}

/* =========================================================
   LỊCH ÂM VIỆT NAM - MÚI GIỜ UTC+7
   ========================================================= */

function INT(d){return Math.floor(d)}

function jdFromDate(dd,mm,yy){
 const a=INT((14-mm)/12);
 const y=yy+4800-a;
 const m=mm+12*a-3;
 let jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-INT(y/100)+INT(y/400)-32045;
 if(jd<2299161)jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-32083;
 return jd;
}

function newMoon(k){
 const T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;
 let jd=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
 jd+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
 const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
 const Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
 const F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
 const C=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*M*dr)-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(2*Mpr*dr)-0.0004*Math.sin(3*Mpr*dr)+0.0104*Math.sin(2*F*dr)-0.0051*Math.sin((M+Mpr)*dr)-0.0074*Math.sin((M-Mpr)*dr)+0.0004*Math.sin((2*F+M)*dr)-0.0004*Math.sin((2*F-M)*dr)-0.0006*Math.sin((2*F+Mpr)*dr)+0.0010*Math.sin((2*F-Mpr)*dr)+0.0005*Math.sin((2*Mpr+M)*dr);
 const deltaT=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;
 return jd+C-deltaT;
}

function getNewMoonDay(k,tz=7){return INT(newMoon(k)+0.5+tz/24)}

function sunLongitudeAngle(jdn){
 const T=(jdn-2451545)/36525,T2=T*T,dr=Math.PI/180;
 const M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
 const L0=280.46645+36000.76983*T+0.0003032*T2;
 const DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M)+(0.019993-0.000101*T)*Math.sin(2*dr*M)+0.000290*Math.sin(3*dr*M);
 let L=(L0+DL)*dr;
 L-=Math.PI*2*INT(L/(Math.PI*2));
 return L;
}

function sunLongitude(jdn){return INT(sunLongitudeAngle(jdn)/(Math.PI/6))}
function getSunLongitude(dayNumber,tz=7){return sunLongitude(dayNumber-0.5-tz/24)}

function getWinterSolsticeDay(year,tz=7){
 const approximateJD=jdFromDate(21,12,year)-0.5;
 let low=approximateJD-4,high=approximateJD+4;
 for(let i=0;i<45;i++){
  const mid=(low+high)/2;
  if(sunLongitudeAngle(mid)<Math.PI*1.5)low=mid;else high=mid;
 }
 return INT((low+high)/2+0.5+tz/24);
}

function getLunarMonth11(year,tz=7){
 const solsticeDay=getWinterSolsticeDay(year,tz);
 let k=INT((solsticeDay-2415021.076998695)/29.530588853);
 while(getNewMoonDay(k,tz)>solsticeDay)k--;
 while(getNewMoonDay(k+1,tz)<=solsticeDay)k++;
 return getNewMoonDay(k,tz);
}

function getLeapMonthOffset(a11,tz=7){
 const k=INT(0.5+(a11-2415021.076998695)/29.530588853);
 let last=0,i=1,arc=getSunLongitude(getNewMoonDay(k+i,tz),tz);
 do{last=arc;i++;arc=getSunLongitude(getNewMoonDay(k+i,tz),tz)}while(arc!==last&&i<14);
 return i-1;
}

function convertSolar2Lunar(dd,mm,yy,tz=7){
 const dayNumber=jdFromDate(dd,mm,yy);
 const k=INT((dayNumber-2415021.076998695)/29.530588853);
 let monthStart=getNewMoonDay(k+1,tz);
 if(monthStart>dayNumber)monthStart=getNewMoonDay(k,tz);
 let a11=getLunarMonth11(yy,tz),b11=a11,lunarYear;
 if(a11>=monthStart){lunarYear=yy;a11=getLunarMonth11(yy-1,tz)}else{lunarYear=yy+1;b11=getLunarMonth11(yy+1,tz)}
 const lunarDay=dayNumber-monthStart+1;
 const diff=INT((monthStart-a11)/29);
 let lunarMonth=diff+11,lunarLeap=0;
 if(b11-a11>365){
  const leapMonth=getLeapMonthOffset(a11,tz);
  if(diff>=leapMonth){lunarMonth=diff+10;if(diff===leapMonth)lunarLeap=1}
 }
 if(lunarMonth>12)lunarMonth-=12;
 if(lunarMonth>=11&&diff<4)lunarYear--;
 return{day:lunarDay,month:lunarMonth,year:lunarYear,leap:lunarLeap};
}

function getLunarDateFormatted(date=new Date()){
 try{
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
  const values={};
  for(const part of parts)if(part.type!=="literal")values[part.type]=Number(part.value);
  const lunar=convertSolar2Lunar(values.day,values.month,values.year,7);
  return `Ngày ${lunar.day} tháng ${lunar.month}${lunar.leap?" nhuận":""} năm ${lunar.year} ÂL`;
 }catch(_){return "Âm lịch không khả dụng"}
}

const canvas=$("weatherFxCanvas");
try{canvasCtx=canvas.getContext("2d",{alpha:true})}catch(_){canvasCtx=null}

function resizeCanvas(){
 if(!canvasCtx)return;
 const dpr=Math.min(window.devicePixelRatio||1,1.5);
 const w=window.innerWidth,h=window.innerHeight;
 canvas.width=Math.round(w*dpr);
 canvas.height=Math.round(h*dpr);
 canvas.style.width=w+"px";
 canvas.style.height=h+"px";
 canvasCtx.setTransform(dpr,0,0,dpr,0,0);
 if(fxType==="stars")initParticles("stars",28);
 else if(fxType!=="none")initParticles(fxType,particleCount(fxType));
}

function particleCount(type){return({sunny:24,snow:32,drizzle:28,rain:42,storm:50,fog:5,stars:28})[type]||0}

function initParticles(type,count){
 particles=[];
 const w=window.innerWidth,h=window.innerHeight;
 for(let i=0;i<count;i++){
  if(type==="sunny")particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+1,dx:(Math.random()-.5)*.25,dy:(Math.random()-.5)*.25,a:Math.random()*.35+.1});
  else if(type==="snow")particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.5+1,dy:Math.random()*.8+.4,dx:(Math.random()-.5)*.35,a:Math.random()*Math.PI*2});
  else if(type==="drizzle"||type==="rain"||type==="storm")particles.push({x:Math.random()*w,y:Math.random()*h,len:type==="drizzle"?Math.random()*8+5:Math.random()*17+10,s:type==="drizzle"?Math.random()*3+2:Math.random()*7+8});
  else if(type==="fog")particles.push({x:Math.random()*w,y:Math.random()*h,w:Math.random()*180+100,h:Math.random()*30+15,s:Math.random()*.35+.15,a:Math.random()*.08+.035});
  else if(type==="stars")particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.2,a:Math.random(),da:Math.random()*.012+.003});
 }
}

function drawFrame(){
 if(!pageActive||!canvasCtx)return;
 const c=canvasCtx,w=window.innerWidth,h=window.innerHeight;
 c.clearRect(0,0,w,h);

 if(fxType==="stars"){
  for(const p of particles){
   p.a+=p.da;if(p.a>1||p.a<.1)p.da*=-1;
   c.fillStyle=`rgba(255,255,255,${Math.max(.08,Math.min(1,p.a))})`;
   c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();
  }
 }else if(fxType==="sunny"){
  for(const p of particles){
   c.fillStyle=`rgba(255,235,150,${p.a})`;
   c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();
   p.x=(p.x+p.dx+w)%w;p.y=(p.y+p.dy+h)%h;
  }
 }else if(fxType==="snow"){
  c.fillStyle="rgba(255,255,255,.65)";
  for(const p of particles){
   c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();
   p.y+=p.dy;p.a+=.02;p.x+=Math.sin(p.a)*.35+p.dx;
   if(p.y>h+5){p.y=-5;p.x=Math.random()*w}
  }
 }else if(fxType==="drizzle"||fxType==="rain"||fxType==="storm"){
  c.strokeStyle=fxType==="drizzle"?"rgba(174,219,255,.25)":"rgba(174,219,255,.38)";
  c.lineWidth=fxType==="drizzle"?1:1.3;
  c.beginPath();
  for(const p of particles){
   c.moveTo(p.x,p.y);c.lineTo(p.x-1,p.y+p.len);
   p.y+=p.s;p.x-=.6;
   if(p.y>h){p.y=-20;p.x=Math.random()*w}
  }
  c.stroke();
 }else if(fxType==="fog"){
  for(const p of particles){
   const g=c.createLinearGradient(p.x,p.y,p.x+p.w,p.y);
   g.addColorStop(0,"rgba(200,220,240,0)");g.addColorStop(.5,`rgba(200,220,240,${p.a})`);g.addColorStop(1,"rgba(200,220,240,0)");
   c.fillStyle=g;c.fillRect(p.x,p.y,p.w,p.h);
   p.x+=p.s;if(p.x>w)p.x=-p.w;
  }
 }
 if(!reducedMotion)rafId=requestAnimationFrame(drawFrame);
}

function startCanvas(){if(!pageActive||reducedMotion||rafId||!canvasCtx)return;rafId=requestAnimationFrame(drawFrame)}
function stopCanvas(){if(rafId){cancelAnimationFrame(rafId);rafId=0}if(canvasCtx)canvasCtx.clearRect(0,0,window.innerWidth,window.innerHeight)}

function triggerLightning(){
 if(!pageActive||fxType!=="storm")return;
 const flash=document.createElement("div");
 flash.style.cssText="position:fixed;inset:0;background:rgba(255,255,255,.28);z-index:3;pointer-events:none";
 document.body.appendChild(flash);
 setTimeout(()=>flash.remove(),90);
}

function setWeatherFX(code){
 if(lightningTimer){clearInterval(lightningTimer);lightningTimer=null}
 lastWeatherCode=code;
 const hour=Number(new Intl.DateTimeFormat("en-US",{timeZone:TIME_ZONE,hour:"2-digit",hourCycle:"h23"}).format(new Date()));

 if(code===0||code===1)fxType="sunny";
 else if(code===2||code===3)fxType=(hour>=19||hour<5)?"stars":"none";
 else if(code===45||code===48)fxType="fog";
 else if(code>=51&&code<=57)fxType="drizzle";
 else if((code>=61&&code<=67)||(code>=80&&code<=82))fxType="rain";
 else if((code>=71&&code<=77)||(code>=85&&code<=86))fxType="snow";
 else if(code>=95)fxType="storm";
 else fxType="none";

 initParticles(fxType,particleCount(fxType));
 if(fxType==="storm")lightningTimer=setInterval(()=>{if(Math.random()<.3)triggerLightning()},5000);
 if(pageActive)startCanvas();
}

function applyOpacity(value){
 const v=Math.max(5,Math.min(95,Number(value)||45));
 const ratio=v/100;
 const specular=Math.max(0.10, Math.min(0.32, 0.34 - ratio*0.22));
 document.documentElement.style.setProperty("--surface-opacity",String(ratio));
 document.documentElement.style.setProperty("--glass-specular",specular.toFixed(2));
 setText("opacityValue",`${Math.round(v)}%`);
 safeStorageSet(OPACITY_KEYS[currentMode],String(v));
}

function weatherDescription(code){
 if(code===0)return{text:"Trời quang",icon:"☀️"};
 if(code===1)return{text:"Ít mây",icon:"🌤️"};
 if(code===2)return{text:"Có mây",icon:"⛅"};
 if(code===3)return{text:"Nhiều mây",icon:"☁️"};
 if(code===45||code===48)return{text:"Sương mù",icon:"🌫️"};
 if(code>=51&&code<=57)return{text:"Mưa phùn",icon:"🌦️"};
 if(code>=61&&code<=67)return{text:"Trời mưa",icon:"🌧️"};
 if(code>=71&&code<=77)return{text:"Có tuyết",icon:"🌨️"};
 if(code>=80&&code<=82)return{text:"Mưa rào",icon:"🌧️"};
 if(code===85||code===86)return{text:"Mưa tuyết",icon:"🌨️"};
 if(code>=95)return{text:"Giông bão",icon:"⛈️"};
 return{text:"Chưa rõ thời tiết",icon:"🌡️"};
}

function parseApiLocalTime(v){return typeof v==="string"?v.slice(0,16):""}

function findCurrentHourIndex(data){
 const times=data?.hourly?.time;
 if(!Array.isArray(times))return -1;
 const now=new Intl.DateTimeFormat("sv-SE",{timeZone:TIME_ZONE,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hourCycle:"h23"}).format(new Date()).replace(" ","T");
 let idx=0;
 for(let i=0;i<times.length;i++){
  if(times[i].slice(0,13)<=now.slice(0,13))idx=i;else break;
 }
 return idx;
}

function getNextHoursForecast(data){
 const times=data?.hourly?.time,probs=data?.hourly?.precipitation_probability;
 if(!Array.isArray(times)||!Array.isArray(probs))return null;
 const idx=findCurrentHourIndex(data);
 if(idx<0)return null;
 const a=[];
 for(let n=1;n<=FORECAST_HOURS;n++){
  const i=idx+n,p=Number(probs[i]);
  if(i<times.length&&Number.isFinite(p))a.push({probability:p,time:parseApiLocalTime(times[i])});
 }
 return a.length?a.reduce((best,x)=>x.probability>best.probability?x:best):null;
}

function formatHourRange(t){
 if(!t)return"Chưa có mốc dự báo";
 const h=Number(t.slice(11,13)),m=t.slice(14,16);
 return`${t.slice(11,16)}–${String((h+1)%24).padStart(2,"0")}:${m}`;
}

function applyRainLevel(p){
 const widget=$("widgetShape");
 widget.classList.remove("level-low","level-mild","level-warn","level-high");
 let cls="level-low",msg="Khả năng mưa thấp";
 if(p>=80){cls="level-high";msg="⚠️ Cảnh báo mưa rất cao"}
 else if(p>=60){cls="level-warn";msg="⚠️ Cảnh báo mưa"}
 else if(p>=40){cls="level-mild";msg="Chú ý khả năng có mưa"}
 widget.classList.add(cls);
 setText("rain-msg",msg);
 return cls;
}

function renderHourly(data){
 const list=$("hourlyList"),times=data?.hourly?.time,temps=data?.hourly?.temperature_2m,probs=data?.hourly?.precipitation_probability,codes=data?.hourly?.weather_code;
 if(!list)return;
 list.replaceChildren();
 const idx=findCurrentHourIndex(data);
 if(idx<0){list.textContent="Chưa có dữ liệu";return}

 for(let n=1;n<=6;n++){
  const i=idx+n;
  if(i>=times.length)break;
  const condition=weatherDescription(Number(codes?.[i]??-1));
  const item=document.createElement("div");item.className="hour-item";
  const time=document.createElement("span");time.className="hour-time";time.textContent=(times[i]||"").slice(11,16);
  const icon=document.createElement("span");icon.className="hour-icon";icon.textContent=condition.icon;
  const temp=document.createElement("span");temp.className="hour-temp";temp.textContent=Number.isFinite(Number(temps?.[i]))?`${Math.round(Number(temps[i]))}°`:"--";
  const rain=document.createElement("span");rain.className="hour-rain";rain.textContent=Number.isFinite(Number(probs?.[i]))?`💧${Math.round(Number(probs[i]))}%`:"--";
  item.append(time,icon,temp,rain);
  list.appendChild(item);
 }
}

function loadFromCache(){

  if(Number.isFinite(d.weatherCode))setWeatherFX(d.weatherCode);
  if(d.hourlyHtml)$("hourlyList").innerHTML=d.hourlyHtml;

/* =========================================================
   KẾT NỐI API
   ========================================================= */

async function fetchWithTimeout(url,ms=12000){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);
 try{return await fetch(url,{signal:controller.signal,cache:"no-store"})}finally{clearTimeout(timer)}
}

async function fetchWeather(lat,lon){
 if(refreshInFlight)return;
 refreshInFlight=true;
 const wp=new URLSearchParams({latitude:String(lat),longitude:String(lon),current:"temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,uv_index",daily:"temperature_2m_min,temperature_2m_max",hourly:"precipitation_probability,temperature_2m,weather_code",timezone:TIME_ZONE,forecast_days:"2",wind_speed_unit:"kmh"});
 const ap=new URLSearchParams({latitude:String(lat),longitude:String(lon),current:"european_aqi"});

 try{
  const results=await Promise.allSettled([
   fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?${wp}`),
   fetchWithTimeout(`https://air-quality-api.open-meteo.com/v1/air-quality?${ap}`,9000)
  ]);
  const wr=results[0];
  if(wr.status!=="fulfilled"||!wr.value.ok)throw new Error("Weather API unavailable");
  const data=await wr.value.json();
  if(!data.current)throw new Error("Missing current weather");

  let aqi="--";
  if(results[1].status==="fulfilled"&&results[1].value.ok){
   try{const ad=await results[1].value.json();if(Number.isFinite(Number(ad.current?.european_aqi)))aqi=Math.round(Number(ad.current.european_aqi))}catch(_){}
  }

  const cur=data.current;
  const temperature=Number(cur.temperature_2m),humidity=Number(cur.relative_humidity_2m),wind=Number(cur.wind_speed_10m),code=Number(cur.weather_code);
  const uv=Number.isFinite(Number(cur.uv_index))?Math.round(Number(cur.uv_index)):"--";
  setText("aqi-uv",`AQI: ${aqi} · UV: ${uv}`);

  const min=Number(data.daily?.temperature_2m_min?.[0]),max=Number(data.daily?.temperature_2m_max?.[0]);
  setText("temp-range",`${Number.isFinite(min)?Math.round(min):"--"}° / ${Number.isFinite(max)?Math.round(max):"--"}°`);
  setText("temp",Number.isFinite(temperature)?`${Math.round(temperature)}°`:"--°");
  setText("humidity",Number.isFinite(humidity)?`${Math.round(humidity)}%`:"--%");
  setText("wind",Number.isFinite(wind)?Math.round(wind):"--");

  const cond=weatherDescription(code);
  setText("desc",cond.text);setText("weather-icon",cond.icon);
  setWeatherFX(code);

  const rain=getNextHoursForecast(data);
  let level="level-low";
  if(rain){setText("rain-pct",`${Math.round(rain.probability)}%`);setText("rain-period",`Cao nhất: ${formatHourRange(rain.time)}`);level=applyRainLevel(rain.probability)}
  else{setText("rain-pct","--%");setText("rain-period","Không có dữ liệu dự báo");level=applyRainLevel(0)}

  renderHourly(data);
  $("widgetShape").classList.remove("error");

  const stamp=new Intl.DateTimeFormat("vi-VN",{timeZone:TIME_ZONE,hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit",hour12:false}).format(new Date());
  setText("updated",`Cập nhật ${stamp}`);
  window.lastWeatherFetchAt=Date.now();
  saveToCache(level,code);
 }finally{refreshInFlight=false}
}

async function fetchCityName(lat,lon){
 const key=`${lat.toFixed(3)},${lon.toFixed(3)}`;
 if(key===lastLocationKey&&Date.now()-lastReverseGeocodeAt<30*60*1000)return;
 if(Date.now()-lastReverseGeocodeAt<30*60*1000)return;
 lastReverseGeocodeAt=Date.now();lastLocationKey=key;

 try{
  const p=new URLSearchParams({format:"jsonv2",lat:String(lat),lon:String(lon),"accept-language":"vi"});
  const res=await fetchWithTimeout(`https://nominatim.openstreetmap.org/reverse?${p}`,10000);
  if(!res.ok)throw new Error();
  const d=await res.json(),a=d.address||{};
  let sub=a.ward||a.suburb||a.village||a.quarter||a.hamlet||"";
  let city=a.city||a.town||a.municipality||a.county||a.state||"";
  const short=s=>String(s).replace(/^thành phố\s*/i,"TP. ").replace(/^tỉnh\s*/i,"T. ").replace(/^quận\s*/i,"Q. ").replace(/^huyện\s*/i,"H. ").replace(/^phường\s*/i,"P. ").replace(/^xã\s*/i,"X. ").replace(/^thị trấn\s*/i,"TT. ");
  updateCityDisplay(sub&&city?`${short(sub)}, ${short(city)}`:short(city||"Vị trí hiện tại"));
 }catch(_){}
}

function useFallbackLocation(reason){
 currentLocation={latitude:DEFAULT_LOCATION.latitude,longitude:DEFAULT_LOCATION.longitude,name:DEFAULT_LOCATION.name};
 updateCityDisplay(DEFAULT_LOCATION.name);
 if(reason)setText("updated",reason);
 refreshForCurrentLocation();
}

async function refreshForCurrentLocation(){
 if(!currentLocation||!pageActive)return;
 try{await fetchWeather(currentLocation.latitude,currentLocation.longitude)}
 catch(_){
  $("widgetShape").classList.add("error");
  setText("desc","Mất kết nối mạng");
  setText("rain-msg","Đang dùng dữ liệu cũ");
  setText("updated","Lỗi mạng · Chạm vào khung để thử lại");
 }
}

window.setCarPlayLocation=function(lat,lon){
 lat=Number(lat);lon=Number(lon);
 if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;
 currentLocation={latitude:lat,longitude:lon,name:"Vị trí từ host"};
 if(geoSafetyTimer){clearTimeout(geoSafetyTimer);geoSafetyTimer=null}
 geoInFlight=false;
 updateCityDisplay("Vị trí hiện tại");
 refreshForCurrentLocation();
 fetchCityName(lat,lon);
};

function getLocationAndWeather(){
 if(!pageActive||geoInFlight)return;
 setText("updated","Đang định vị GPS...");
 if(!navigator.geolocation){useFallbackLocation("GPS không khả dụng");return}

 geoInFlight=true;
 let resolved=false;
 geoSafetyTimer=setTimeout(()=>{
  if(resolved)return;
  resolved=true;geoInFlight=false;
  if(!currentLocation)useFallbackLocation("GPS chậm · Dùng vị trí mặc định");
  else refreshForCurrentLocation();
 },6500);

 navigator.geolocation.getCurrentPosition(
  async pos=>{
   if(resolved)return;
   resolved=true;geoInFlight=false;clearTimeout(geoSafetyTimer);
   const lat=pos.coords.latitude,lon=pos.coords.longitude;
   currentLocation={latitude:lat,longitude:lon,name:"Vị trí hiện tại"};
   await Promise.allSettled([refreshForCurrentLocation(),fetchCityName(lat,lon)]);
  },
  ()=>{
   if(resolved)return;
   resolved=true;geoInFlight=false;clearTimeout(geoSafetyTimer);
   if(!currentLocation)useFallbackLocation("Chưa cấp quyền GPS · Dùng vị trí mặc định");
   else refreshForCurrentLocation();
  },
  {enableHighAccuracy:false,timeout:5500,maximumAge:5*60*1000}
 );
}

function refreshData(){
 if(refreshInFlight)return;
 setText("updated","Đang làm mới dữ liệu...");
 if(currentLocation)refreshForCurrentLocation();
 else getLocationAndWeather();
}

/* =========================================================
   DUY TRÌ HOẠT ĐỘNG VÀ TIẾT KIỆM TÀI NGUYÊN
   ========================================================= */

function startPeriodicRefresh(){
 if(refreshTimer)clearInterval(refreshTimer);
 refreshTimer=setInterval(()=>{
  if(!pageActive||document.hidden)return;
  if(currentLocation)refreshForCurrentLocation();
  else getLocationAndWeather();
 },REFRESH_INTERVAL_MS);
}

function handleVisibility(){
 pageActive=!document.hidden;
 if(pageActive){
  updateAmbianceAura();updateClockAndCalendar();startCanvas();
  if(!currentLocation)getLocationAndWeather();
  else if(Date.now()-(window.lastWeatherFetchAt||0)>REFRESH_INTERVAL_MS)refreshForCurrentLocation();
 }else{
  stopCanvas();
  if(lightningTimer){clearInterval(lightningTimer);lightningTimer=null}
 }
}

document.addEventListener("visibilitychange",handleVisibility);
window.addEventListener("pagehide",()=>{pageActive=false;stopCanvas();stopClock()});
window.addEventListener("pageshow",()=>{pageActive=!document.hidden;if(pageActive){startClock();startCanvas()}});

/* =========================================================
   KHỞI TẠO WIDGET
   ========================================================= */

function startWeatherWidget(){
 loadSavedLayout();
 loadOpacity();
 loadFromCache();
 updateAmbianceAura();
 auraTimer=setInterval(updateAmbianceAura,5*60*1000);
 startClock();
 resizeCanvas();
 startCanvas();

 $("widgetShape").addEventListener("click", refreshData);

 getLocationAndWeather();
 startPeriodicRefresh();
}

startWeatherWidget();
window.refreshWeatherWidget=refreshData;
</script>
</body>
