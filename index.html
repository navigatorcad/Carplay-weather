<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Weather CarPlay Widget</title>
  <style>
    :root {
      --accent: #90caf9;
      --accent-rgb: 144, 202, 249;
      --text: #f8fafc;
      --muted: #aebdce;
      --bg-gradient: radial-gradient(circle at 50% 38%, #202b3a 0%, #111923 52%, #080c12 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      position: relative;
    }

    /* LỚP PHỦ HIỆU ỨNG CANVAS TOÀN TRANG */
    .weather-fx {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* MÀU NỀN TOÀN TRANG THEO CÁC NHÓM THỜI TIẾT */
    body.weather-sunny { background: radial-gradient(circle at 50% 20%, #1c2b42 0%, #0d1522 60%, #04070c 100%); }
    body.weather-cloudy { background: radial-gradient(circle at 50% 20%, #182230 0%, #0a0f18 60%, #030508 100%); }
    body.weather-fog { background: radial-gradient(circle at 50% 20%, #1f252d 0%, #0f1217 60%, #050608 100%); }
    body.weather-drizzle { background: radial-gradient(circle at 50% 20%, #111d2e 0%, #070e17 60%, #020408 100%); }
    body.weather-rain { background: radial-gradient(circle at 50% 20%, #0f1c2e 0%, #080e18 60%, #020408 100%); }
    body.weather-snow { background: radial-gradient(circle at 50% 20%, #1b2636 0%, #0d131d 60%, #04060a 100%); }
    body.weather-storm { background: radial-gradient(circle at 50% 20%, #22121a 0%, #11080d 60%, #050204 100%); }

    @keyframes pulse-high {
      0% { box-shadow: 0 0 25px rgba(255, 69, 58, .7), inset 0 0 18px rgba(255, 69, 58, .3); }
      50% { box-shadow: 0 0 45px rgba(255, 69, 58, 1), inset 0 0 30px rgba(255, 69, 58, .6); }
      100% { box-shadow: 0 0 25px rgba(255, 69, 58, .7), inset 0 0 18px rgba(255, 69, 58, .3); }
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .widget-container {
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    /* GIAO DIỆN HÌNH TRÒN & CHỮ NHẬT CÓ HIỆU ỨNG 3D FLIP */
    .bubble, .card {
      background: var(--bg-gradient);
      border: 4px solid var(--accent);
      box-shadow: 0 0 25px rgba(var(--accent-rgb), .68), inset 0 0 18px rgba(var(--accent-rgb), .22);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.4, 0.2, 0.2, 1), border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .bubble {
      width: min( min(310px, 92vw), 92vh );
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      justify-content: center;
      padding: 22px 19px;
    }

    .card {
      width: 290px;
      height: 420px;
      flex-shrink: 0;
      border-radius: 24px;
      justify-content: space-between;
      padding: 20px 16px;
    }

    .bubble:active, .card:active { transform: scale(0.97); }

    .city {
      max-width: 85%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 650;
      color: #e5edf7;
    }

    /* KHỐI THỜI GIAN TRONG FORM CHỮ NHẬT */
    .card-time-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      margin-top: -2px;
    }

    .card-time-block .clock-text {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(var(--accent-rgb), 0.6);
      letter-spacing: 0.5px;
    }

    .solar-date {
      font-size: 11px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .lunar-date {
      font-size: 10px;
      font-weight: 600;
      color: #ffd54f;
    }

    /* KHỐI THỜI GIAN BÊN NGOÀI FORM TRÒN (VIỀN SÁNG PHÁT RA RỰC RỠ ĐỒNG BỘ MÀU KHUNG) */
    .external-time-bar {
      display: none; /* Chỉ hiện ở form tròn */
      width: min( min(310px, 92vw), 92vh ); /* Khớp chuẩn đường kính khung tròn */
      margin-top: 12px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .external-time-bar .clock-text {
      font-size: 19px;
      font-weight: 850;
      color: #ffffff;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      /* Hiệu ứng viền sáng phát ra (Neon Glow) cực mạnh bao quanh ký tự, đồng bộ màu theo biến --accent */
      text-shadow: 0 0 6px var(--accent), 0 0 12px var(--accent), 0 0 22px var(--accent), 0 0 35px rgba(var(--accent-rgb), 0.8);
      letter-spacing: 1px;
    }

    .external-time-bar .dates-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .external-time-bar .solar-date {
      font-size: 9.5px;
      font-weight: 750;
      color: #f1f5f9;
      text-shadow: 0 0 5px var(--accent), 0 0 10px rgba(var(--accent-rgb), 0.7);
    }

    .external-time-bar .lunar-date {
      font-size: 9.5px;
      font-weight: 750;
      color: #ffe082;
      text-shadow: 0 0 5px #ffd54f, 0 0 10px rgba(255, 213, 79, 0.7);
    }

    .main-temp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .temp {
      font-size: 48px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: -2px;
    }

    .weather-icon {
      font-size: 36px;
      line-height: 1;
      animation: float-icon 3s ease-in-out infinite;
    }

    @keyframes float-icon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .desc {
      color: #d0dbea;
      font-size: 14px;
      font-weight: 550;
      max-width: 90%;
    }

    .aqi-uv {
      font-size: 11px;
      font-weight: 650;
      color: var(--accent);
      letter-spacing: 0.3px;
    }

    .temp-range {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-top: -2px;
    }

    .divider {
      width: 88%;
      height: 1px;
      background: rgba(255,255,255,.20);
      margin: 4px 0;
    }

    .details {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 91%;
    }

    .detail-box {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .detail-val {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 16px;
      font-weight: 750;
      white-space: nowrap;
    }

    .detail-icon { font-size: 18px; line-height: 1; }
    .detail-unit { font-size: 11px; font-weight: 550; color: #cbd5e1; margin-left: 1px; }
    .detail-lbl { font-size: 11px; color: var(--muted); }

    .vertical-divider {
      width: 1px;
      height: 28px;
      background: rgba(255,255,255,.25);
    }

    .rain-section { width: 100%; }

    .rain-prob {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .rain-icon { font-size: 18px; }
    .rain-prob strong { font-size: 18px; font-weight: 800; color: var(--accent); }
    .rain-period { font-size: 10px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
    .rain-alert { font-size: 10px; font-weight: 650; margin-top: 2px; color: var(--accent); white-space: nowrap; }
    .updated { width: 100%; color: #8190a3; font-size: 8px; opacity: .9; }

    /* NÚT CHUYỂN ĐỔI GIAO DIỆN Ở GÓC DƯỚI BÊN TRÁI */
    .mode-toggle-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(20, 30, 45, 0.95);
      border: 2px solid var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      z-index: 9999;
      transition: transform 0.1s ease, background 0.3s ease;
    }

    .mode-toggle-btn:active { transform: scale(0.92); }

    .level-low { --accent: #90caf9; --accent-rgb: 144, 202, 249; }
    .level-mild { --accent: #ffd54f; --accent-rgb: 255, 213, 79; }
    .level-warn { --accent: #ff9800; --accent-rgb: 255, 152, 0; }
    .level-high {
      --accent: #ff453a;
      --accent-rgb: 255, 69, 58;
      animation: pulse-high 1.2s infinite ease-in-out;
    }

    .level-low, .level-mild, .level-warn {
      border-color: var(--accent);
      box-shadow: 0 0 27px rgba(var(--accent-rgb), .72), inset 0 0 17px rgba(var(--accent-rgb), .27);
    }

    .error .desc { color: #ffb4ab; }
  </style>
</head>
<body>

  <!-- LỚP PHỦ CANVAS HIỆU ỨNG THỜI TIẾT TOÀN TRANG -->
  <canvas class="weather-fx" id="weatherFxCanvas"></canvas>

  <!-- NÚT CHUYỂN ĐỔI GIAO DIỆN -->
  <button class="mode-toggle-btn" id="modeToggleBtn" onclick="toggleLayoutMode(event)">🔄 Đổi Form</button>

  <div class="main-wrapper">
    <div class="widget-container">
      <main class="bubble level-low" id="widgetShape" aria-live="polite" onclick="refreshData()">
        <div class="city" id="city">📍 Đang xác định vị trí...</div>
        
        <!-- Khối thời gian hiển thị riêng cho Form Chữ Nhật -->
        <div class="card-time-block" id="cardTimeBlock" style="display: none;">
          <div class="clock-text" id="cardClock">-- : -- : --</div>
          <div class="solar-date" id="cardSolar">--</div>
          <div class="lunar-date" id="cardLunar">--</div>
        </div>

        <div class="main-temp">
          <div class="temp" id="temp">--°</div>
          <div class="weather-icon" id="weather-icon">⛅</div>
        </div>
        
        <div class="desc" id="desc">Đang tải thời tiết...</div>
        <div class="aqi-uv" id="aqi-uv">AQI: -- · UV: --</div>
        <div class="temp-range" id="temp-range">--° / --°</div>

        <div class="divider"></div>

        <div class="details">
          <div class="detail-box">
            <div class="detail-val">
              <span class="detail-icon">💧</span>
              <span id="humidity">--%</span>
            </div>
            <div class="detail-lbl">Độ ẩm</div>
          </div>

          <div class="vertical-divider"></div>

          <div class="detail-box">
            <div class="detail-val">
              <span class="detail-icon">💨</span>
              <span id="wind">--</span>
              <small class="detail-unit">km/h</small>
            </div>
            <div class="detail-lbl">Tốc độ gió</div>
          </div>
        </div>

        <div class="divider"></div>

        <section class="rain-section">
          <div class="rain-prob">
            <span class="rain-icon">🌧️</span>
            <span>Mưa 3 giờ tới</span>
            <strong id="rain-pct">--%</strong>
          </div>
          <div class="rain-period" id="rain-period">Đang lấy dự báo...</div>
          <div class="rain-alert" id="rain-msg">Đang cập nhật</div>
        </section>

        <div class="updated" id="updated">Đang kết nối dữ liệu...</div>
      </main>
    </div>

    <!-- Khối thời gian bên ngoài cho Form Tròn (Phát sáng rực rỡ đồng bộ màu khung) -->
    <div class="external-time-bar" id="externalTimeBar">
      <div class="clock-text" id="extClock">
        <span id="extHours">--</span>
        <span style="opacity: 0.6;">:</span>
        <span id="extMinutes">--</span>
        <span style="opacity: 0.6;">:</span>
        <span id="extSeconds">--</span>
      </div>
      <div class="dates-row">
        <span class="solar-date" id="extSolar">--</span>
        <span class="lunar-date" id="extLunar">--</span>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const DEFAULT_LOCATION = { latitude: 20.5453, longitude: 105.9122, name: "Phủ Lý (mặc định)" };
    const REFRESH_INTERVAL_MS = 30 * 60 * 1000;
    const FORECAST_HOURS = 3;
    const TIME_ZONE = "Asia/Bangkok";
    const CACHE_KEY = "carplay_weather_cache_v15";
    const LAYOUT_KEY = "carplay_layout_mode_v13";

    const $ = (id) => document.getElementById(id);
    let currentLocation = null;
    let lastReverseGeocodeAt = 0;
    let refreshTimer = null;
    let currentMode = "bubble";
    let currentScale = 1;

    // --- THUẬT TOÁN ĐỔI DƯƠNG LỊCH sang ÂM LỊCH (Việt Nam) ---
    function jdFromDate(dd, mm, yy) {
      var a = Math.floor((14 - mm) / 12);
      var y = yy + 4800 - a;
      var m = mm + 12 * a - 3;
      var jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
      return jd;
    }

    function getLunarDateFormatted(dateObj) {
      const d = dateObj.getDate();
      const m = dateObj.getMonth() + 1;
      const y = dateObj.getFullYear();
      const jd = jdFromDate(d, m, y);
      const lunarDays = ((jd - 2451545.0 + 0.5) % 29.53058885);
      let lunarDay = Math.floor(lunarDays) + 1;
      if (lunarDay > 30) lunarDay = 30;
      if (lunarDay < 1) lunarDay = 1;
      
      let lunarMonth = ((Math.floor((jd - 2451545.0) / 29.53058885) + 2) % 12) + 1;
      if (lunarMonth <= 0) lunarMonth += 12;
      
      return `Âm: ${lunarDay}/${lunarMonth}`;
    }

    // --- CẬP NHẬT ĐỒNG HỒ & THỜI GIAN THỰC MỖI GIÂY ---
    function updateClockAndCalendar() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const daysOfWeek = ["CN", "Th 2", "Th 3", "Th 4", "Th 5", "Th 6", "Th 7"];
      const dayOfWeek = daysOfWeek[now.getDay()];
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const solarStr = `${dayOfWeek}, ${day}/${month}`;
      const lunarStr = getLunarDateFormatted(now);

      if ($('cardClock')) $('cardClock').textContent = `${hours} : ${minutes} : ${seconds}`;
      if ($('cardSolar')) $('cardSolar').textContent = `${dayOfWeek}, ${day}/${month}/${now.getFullYear()}`;
      if ($('cardLunar')) $('cardLunar').textContent = getLunarDateFormatted(now).replace("Âm: ", "Ngày ") + " Âm lịch";

      if ($('extHours')) $('extHours').textContent = hours;
      if ($('extMinutes')) $('extMinutes').textContent = minutes;
      if ($('extSeconds')) $('extSeconds').textContent = seconds;
      if ($('extSolar')) $('extSolar').textContent = solarStr;
      if ($('extLunar')) $('extLunar').textContent = lunarStr;
    }
    setInterval(updateClockAndCalendar, 1000);
    updateClockAndCalendar();

    // --- HỆ THỐNG HIỆU ỨNG CANVAS ĐA TRẠNG THÁI THỜI TIẾT ---
    const canvas = $("weatherFxCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let fxType = "none";
    let lightningTimer = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function initParticles(type, count) {
      particles = [];
      for (let i = 0; i < count; i++) {
        if (type === "sunny") {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 1,
            speedY: (Math.random() - 0.5) * 0.3,
            speedX: (Math.random() - 0.5) * 0.3,
            opacity: Math.random() * 0.4 + 0.1
          });
        } else if (type === "snow") {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 3 + 1.5,
            speedY: Math.random() * 0.8 + 0.5,
            speedX: Math.random() * 0.5 - 0.25,
            opacity: Math.random() * 0.6 + 0.2,
            angle: Math.random() * Math.PI * 2
          });
        } else if (type === "drizzle") {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            length: Math.random() * 10 + 5,
            speed: Math.random() * 4 + 3,
            opacity: Math.random() * 0.3 + 0.15
          });
        } else if (type === "rain" || type === "storm") {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            length: Math.random() * 22 + 12,
            speed: Math.random() * 12 + 10,
            opacity: Math.random() * 0.5 + 0.3
          });
        } else if (type === "fog") {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            width: Math.random() * 200 + 100,
            height: Math.random() * 40 + 20,
            speed: Math.random() * 0.4 + 0.2,
            opacity: Math.random() * 0.12 + 0.05
          });
        }
      }
    }

    function animateWeatherFX() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (fxType === "sunny") {
        for (let p of particles) {
          ctx.fillStyle = `rgba(255, 235, 150, ${p.opacity})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          p.y += p.speedY;
          p.x += p.speedX;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
        }
      } else if (fxType === "snow") {
        ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
        for (let p of particles) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          p.y += p.speedY;
          p.angle += 0.02;
          p.x += Math.sin(p.angle) * 0.4 + p.speedX;
          if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
        }
      } else if (fxType === "drizzle") {
        ctx.strokeStyle = "rgba(174, 219, 255, 0.25)";
        ctx.lineWidth = 1;
        for (let p of particles) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - 0.5, p.y + p.length);
          ctx.stroke();
          p.y += p.speed;
          if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
        }
      } else if (fxType === "rain" || fxType === "storm") {
        ctx.strokeStyle = "rgba(174, 219, 255, 0.45)";
        ctx.lineWidth = 1.5;
        ctx.lineCap = "round";
        for (let p of particles) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - 1.5, p.y + p.length);
          ctx.stroke();
          p.y += p.speed;
          p.x -= 0.8;
          if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
        }
      } else if (fxType === "fog") {
        for (let p of particles) {
          let grad = ctx.createLinearGradient(p.x, p.y, p.x + p.width, p.y);
          grad.addColorStop(0, `rgba(200, 220, 240, 0)`);
          grad.addColorStop(0.5, `rgba(200, 220, 240, ${p.opacity})`);
          grad.addColorStop(1, `rgba(200, 220, 240, 0)`);
          ctx.fillStyle = grad;
          ctx.fillRect(p.x, p.y, p.width, p.height);
          p.x += p.speed;
          if (p.x > canvas.width) p.x = -p.width;
        }
      }
      requestAnimationFrame(animateWeatherFX);
    }
    animateWeatherFX();

    function triggerLightning() {
      if (fxType !== "storm") return;
      const flash = document.createElement("div");
      flash.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.35); z-index:3; pointer-events:none; transition: opacity 0.2s ease;";
      document.body.appendChild(flash);
      setTimeout(() => flash.style.opacity = "0", 60);
      setTimeout(() => flash.remove(), 250);
    }

    function setWeatherFX(code) {
      const body = document.body;
      body.classList.remove("weather-sunny", "weather-cloudy", "weather-fog", "weather-drizzle", "weather-rain", "weather-snow", "weather-storm");
      
      if (lightningTimer) { clearInterval(lightningTimer); lightningTimer = null; }

      if (code === 0 || code === 1) {
        body.classList.add("weather-sunny");
        fxType = "sunny";
        initParticles("sunny", 35);
      } else if (code === 2 || code === 3) {
        body.classList.add("weather-cloudy");
        fxType = "none";
      } else if (code === 45 || code === 48) {
        body.classList.add("weather-fog");
        fxType = "fog";
        initParticles("fog", 6);
      } else if (code >= 51 && code <= 57) {
        body.classList.add("weather-drizzle");
        fxType = "drizzle";
        initParticles("drizzle", 40);
      } else if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) {
        body.classList.add("weather-rain");
        fxType = "rain";
        initParticles("rain", 70);
      } else if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) {
        body.classList.add("weather-snow");
        fxType = "snow";
        initParticles("snow", 50);
      } else if (code >= 95) {
        body.classList.add("weather-storm");
        fxType = "storm";
        initParticles("storm", 100);
        lightningTimer = setInterval(() => {
          if (Math.random() < 0.35) triggerLightning();
        }, 3500);
      } else {
        body.classList.add("weather-cloudy");
        fxType = "none";
      }
    }
    // --------------------------------------------------------

    function setText(id, value) { $(id).textContent = value; }

    function updateCardScale() {
      const widget = $("widgetShape");
      if (currentMode === "card") {
        const containerW = window.innerWidth - 20;
        const containerH = window.innerHeight - 20;
        currentScale = Math.min(containerW / 290, containerH / 420, 1.3);
        widget.style.transform = `scale(${currentScale})`;
      } else {
        currentScale = 1;
        widget.style.transform = "none";
      }
    }

    // HIỆU ỨNG LẬT THẺ 3D MƯỢT MÀ KHI ĐỔI FORM
    function setLayoutMode(mode, save = true) {
      currentMode = mode;
      const widget = $("widgetShape");
      const btn = $("modeToggleBtn");
      const cardTime = $("cardTimeBlock");
      const extTime = $("externalTimeBar");

      widget.style.transform = `scale(${currentScale * 0.85}) rotateY(90deg)`;

      setTimeout(() => {
        if (mode === "card") {
          widget.className = widget.className.replace("bubble", "card");
          btn.textContent = "⭕ Hình Tròn";
          if (cardTime) cardTime.style.display = "flex";
          if (extTime) extTime.style.display = "none";
        } else {
          widget.className = widget.className.replace("card", "bubble");
          btn.textContent = "📱 Hình Chữ Nhật";
          if (cardTime) cardTime.style.display = "none";
          if (extTime) extTime.style.display = "flex";
        }
        updateCardScale();
      }, 200);

      if (save) { localStorage.setItem(LAYOUT_KEY, mode); }
    }

    function toggleLayoutMode(event) {
      event.stopPropagation();
      const newMode = currentMode === "bubble" ? "card" : "bubble";
      setLayoutMode(newMode);
    }

    window.addEventListener("resize", () => {
      updateCardScale();
    });

    function loadSavedLayout() {
      const savedMode = localStorage.getItem(LAYOUT_KEY);
      if (savedMode === "card" || savedMode === "bubble") {
        setLayoutMode(savedMode, false);
      } else {
        setLayoutMode("bubble", false);
      }
    }

    function loadFromCache() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const data = JSON.parse(cached);
          if (data.temp && data.temp !== "--°") {
            setText("temp", data.temp);
            setText("aqi-uv", data.aqiUvText || "AQI: -- · UV: --");
            setText("temp-range", data.tempRange);
            setText("humidity", data.humidity);
            setText("wind", data.wind);
            setText("desc", data.desc);
            setText("weather-icon", data.weatherIcon);
            setText("rain-pct", data.rainPct);
            setText("rain-period", data.rainPeriod);
            setText("rain-msg", data.rainMsg);
            setText("city", data.city);
            setText("updated", data.updated + " (Lưu trữ)");
            if (data.levelClass) {
              const widget = $("widgetShape");
              widget.classList.remove("level-low", "level-mild", "level-warn", "level-high");
              widget.classList.add(data.levelClass);
            }
            if (typeof data.weatherCode === "number") {
              setWeatherFX(data.weatherCode);
            }
          }
        }
      } catch (e) {}
    }

    function saveToCache(levelClass, weatherCode) {
      try {
        const data = {
          temp: $("temp").textContent,
          aqiUvText: $("aqi-uv").textContent,
          tempRange: $("temp-range").textContent,
          humidity: $("humidity").textContent,
          wind: $("wind").textContent,
          desc: $("desc").textContent,
          weatherIcon: $("weather-icon").textContent,
          rainPct: $("rain-pct").textContent,
          rainPeriod: $("rain-period").textContent,
          rainMsg: $("rain-msg").textContent,
          city: $("city").textContent,
          updated: $("updated").textContent,
          levelClass: levelClass,
          weatherCode: weatherCode
        };
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function weatherDescription(code) {
      if (code === 0) return { text: "Trời quang", icon: "☀️" };
      if (code === 1) return { text: "Ít mây", icon: "🌤️" };
      if (code === 2) return { text: "Có mây", icon: "⛅" };
      if (code === 3) return { text: "Nhiều mây", icon: "☁️" };
      if (code === 45 || code === 48) return { text: "Sương mù", icon: "🌫️" };
      if (code >= 51 && code <= 57) return { text: "Mưa phùn", icon: "🌦️" };
      if (code >= 61 && code <= 67) return { text: "Trời mưa", icon: "🌧️" };
      if (code >= 71 && code <= 77) return { text: "Có tuyết", icon: "🌨️" };
      if (code >= 80 && code <= 82) return { text: "Mưa rào", icon: "🌧️" };
      if (code === 85 || code === 86) return { text: "Mưa tuyết", icon: "🌨️" };
      if (code >= 95 && code <= 99) return { text: "Giông bão", icon: "⛈️" };
      return { text: "Chưa rõ thời tiết", icon: "🌡️" };
    }

    function parseApiLocalTime(value) { return typeof value === "string" ? value.slice(0, 16) : ""; }

    function getNextHoursForecast(data) {
      const times = data?.hourly?.time;
      const probabilities = data?.hourly?.precipitation_probability;
      const currentApiTime = parseApiLocalTime(data?.current?.time);

      if (!Array.isArray(times) || !Array.isArray(probabilities) || !currentApiTime) return null;

      let currentIndex = -1;
      for (let i = 0; i < times.length; i++) {
        if (parseApiLocalTime(times[i]) <= currentApiTime) currentIndex = i;
        else break;
      }
      if (currentIndex < 0) currentIndex = 0;

      const candidates = [];
      for (let offset = 1; offset <= FORECAST_HOURS; offset++) {
        const index = currentIndex + offset;
        if (index >= times.length) break;
        const raw = probabilities[index];
        if (raw === null || raw === undefined || !Number.isFinite(Number(raw))) continue;
        candidates.push({ probability: Number(raw), time: parseApiLocalTime(times[index]) });
      }

      if (!candidates.length) return null;
      return candidates.reduce((best, item) => item.probability > best.probability ? item : best);
    }

    function formatHourRange(localTime) {
      if (!localTime) return "Chưa có mốc dự báo";
      const startHour = localTime.slice(11, 16);
      const [hour, minute] = startHour.split(":").map(Number);
      if (!Number.isFinite(hour) || !Number.isFinite(minute)) return startHour;
      const endHour = `${String((hour + 1) % 24).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
      return `${startHour}–${endHour}`;
    }

    function applyRainLevel(probability) {
      const widget = $("widgetShape");
      const pct = $("rain-pct");
      const message = $("rain-msg");

      widget.classList.remove("level-low", "level-mild", "level-warn", "level-high");

      let levelClass = "level-low";
      let messageText = "Khả năng mưa thấp";
      if (probability >= 80) {
        levelClass = "level-high";
        messageText = "⚠️ Cảnh báo mưa rất cao";
      } else if (probability >= 60) {
        levelClass = "level-warn";
        messageText = "⚠️ Cảnh báo mưa";
      } else if (probability >= 40) {
        levelClass = "level-mild";
        messageText = "Chú ý khả năng có mưa";
      }

      widget.classList.add(levelClass);
      pct.style.color = "var(--accent)";
      message.style.color = "var(--accent)";
      message.textContent = messageText;
      return levelClass;
    }

    async function fetchWeather(latitude, longitude) {
      const weatherParams = new URLSearchParams({
        latitude: String(latitude),
        longitude: String(longitude),
        current: "temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,uv_index",
        daily: "temperature_2m_min,temperature_2m_max",
        hourly: "precipitation_probability",
        timezone: TIME_ZONE,
        forecast_days: "1",
        wind_speed_unit: "kmh"
      });

      const aqiParams = new URLSearchParams({
        latitude: String(latitude),
        longitude: String(longitude),
        current: "european_aqi"
      });

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);

      try {
        const [weatherRes, aqiRes] = await Promise.allSettled([
          fetch(`https://api.open-meteo.com/v1/forecast?${weatherParams.toString()}`, { signal: controller.signal, cache: "no-store" }),
          fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${aqiParams.toString()}`, { signal: controller.signal, cache: "no-store" })
        ]);

        if (weatherRes.status !== "fulfilled" || !weatherRes.value.ok) {
          throw new Error("Không tải được dữ liệu thời tiết.");
        }

        const data = await weatherRes.value.json();
        if (!data.current) throw new Error("Không có dữ liệu hiện tại.");

        const temperature = Number(data.current.temperature_2m);
        const humidity = Number(data.current.relative_humidity_2m);
        const wind = Number(data.current.wind_speed_10m);
        const code = Number(data.current.weather_code);
        const uvIndex = data.current.uv_index !== undefined ? Math.round(Number(data.current.uv_index)) : "--";

        let aqiVal = "--";
        if (aqiRes.status === "fulfilled" && aqiRes.value.ok) {
          const aqiData = await aqiRes.value.json();
          if (aqiData.current && aqiData.current.european_aqi !== undefined) {
            aqiVal = Math.round(Number(aqiData.current.european_aqi));
          }
        }
        setText("aqi-uv", `AQI: ${aqiVal} · UV: ${uvIndex}`);

        let minTempStr = "--°";
        let maxTempStr = "--°";
        if (data.daily && Array.isArray(data.daily.temperature_2m_min) && Array.isArray(data.daily.temperature_2m_max)) {
          const minVal = Number(data.daily.temperature_2m_min[0]);
          const maxVal = Number(data.daily.temperature_2m_max[0]);
          if (Number.isFinite(minVal)) minTempStr = `${Math.round(minVal)}°`;
          if (Number.isFinite(maxVal)) maxTempStr = `${Math.round(maxVal)}°`;
        }
        setText("temp-range", `${minTempStr} - ${maxTempStr}`);

        setWeatherFX(code);

        setText("temp", Number.isFinite(temperature) ? `${Math.round(temperature)}°` : "--°");
        setText("humidity", Number.isFinite(humidity) ? `${Math.round(humidity)}%` : "--%");
        setText("wind", Number.isFinite(wind) ? Math.round(wind) : "--");

        const condition = weatherDescription(code);
        setText("desc", condition.text);
        setText("weather-icon", condition.icon);

        let activeLevelClass = "level-low";
        const forecast = getNextHoursForecast(data);
        if (forecast) {
          setText("rain-pct", `${Math.round(forecast.probability)}%`);
          setText("rain-period", `Cao nhất: ${formatHourRange(forecast.time)}`);
          activeLevelClass = applyRainLevel(forecast.probability);
        } else {
          setText("rain-pct", "--%");
          setText("rain-period", "Không có dữ liệu dự báo");
          activeLevelClass = applyRainLevel(0);
        }

        $("widgetShape").classList.remove("error");
        const updatedAt = new Intl.DateTimeFormat("vi-VN", {
          timeZone: TIME_ZONE, hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit", hour12: false
        }).format(new Date());

        setText("updated", `Cập nhật ${updatedAt}`);
        saveToCache(activeLevelClass, code);
      } finally {
        clearTimeout(timeout);
      }
    }

    async function fetchCityName(latitude, longitude) {
      const now = Date.now();
      if (now - lastReverseGeocodeAt < 30 * 60 * 1000) return;
      lastReverseGeocodeAt = now;

      try {
        const params = new URLSearchParams({ format: "jsonv2", lat: String(latitude), lon: String(longitude), "accept-language": "vi" });
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?${params.toString()}`, { headers: { "Accept": "application/json" }, cache: "no-store" });
        if (!res.ok) throw new Error();

        const data = await res.json();
        const address = data.address || {};
        const name = address.city || address.town || address.municipality || address.county || address.state || "Vị trí hiện tại";
        setText("city", `📍 ${name}`);
      } catch (error) {}
    }

    function useFallbackLocation(reason) {
      currentLocation = { latitude: DEFAULT_LOCATION.latitude, longitude: DEFAULT_LOCATION.longitude, name: DEFAULT_LOCATION.name };
      setText("city", `📍 ${DEFAULT_LOCATION.name}`);
      if (reason) setText("updated", reason);
      refreshForCurrentLocation();
    }

    async function refreshForCurrentLocation() {
      if (!currentLocation) return;
      try {
        await fetchWeather(currentLocation.latitude, currentLocation.longitude);
      } catch (error) {
        $("widgetShape").classList.add("error");
        setText("desc", "Mất kết nối mạng");
        setText("rain-msg", "Đang dùng dữ liệu cũ");
        setText("updated", "Lỗi mạng · Chạm để thử lại");
      }
    }

    function getLocationAndWeather() {
      setText("updated", "Đang định vị GPS...");
      if (!navigator.geolocation) {
        useFallbackLocation("GPS không khả dụng");
        return;
      }

      let geolocationResolved = false;
      const safetyTimer = setTimeout(() => {
        if (!geolocationResolved) {
          geolocationResolved = true;
          useFallbackLocation("GPS phản hồi chậm · Dùng vị trí mặc định");
        }
      }, 5000);

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          if (geolocationResolved) return;
          geolocationResolved = true;
          clearTimeout(safetyTimer);

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          currentLocation = { latitude, longitude, name: "Vị trí hiện tại" };
          await Promise.allSettled([refreshForCurrentLocation(), fetchCityName(latitude, longitude)]);
        },
        () => {
          if (geolocationResolved) return;
          geolocationResolved = true;
          clearTimeout(safetyTimer);
          useFallbackLocation("Chưa cấp quyền GPS");
        },
        { enableHighAccuracy: false, timeout: 4000, maximumAge: 60 * 1000 }
      );
    }

    function refreshData() {
      setText("updated", "Đang làm mới dữ liệu...");
      getLocationAndWeather();
    }

    function startWeatherWidget() {
      loadSavedLayout();
      loadFromCache();
      getLocationAndWeather();

      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        if (!navigator.geolocation) { refreshForCurrentLocation(); return; }
        navigator.geolocation.getCurrentPosition(
          (position) => {
            currentLocation = { latitude: position.coords.latitude, longitude: position.coords.longitude, name: "Vị trí hiện tại" };
            refreshForCurrentLocation();
            fetchCityName(position.coords.latitude, position.coords.longitude);
          },
          () => refreshForCurrentLocation(),
          { enableHighAccuracy: false, timeout: 5000, maximumAge: 10 * 60 * 1000 }
        );
      }, REFRESH_INTERVAL_MS);
    }

    startWeatherWidget();
  </script>
