name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          mkdir -p Payload/CarPlayWeather.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Biên dịch trực tiếp file ViewController.swift từ thư mục source của bạn
          swiftc source/ViewController.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -framework UIKit \
            -framework WebKit \
            -o Payload/CarPlayWeather.app/CarPlayWeather

          # Tạo Info.plist chuẩn (chạy full-screen và cấp quyền GPS)
          cat << 'EOF' > Payload/CarPlayWeather.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CarPlayWeather</string>
              <key>CFBundleIdentifier</key>
              <string>com.navigatorcad.carplayweather</string>
              <key>CFBundleName</key>
              <string>CarPlayWeather</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIStatusBarHidden</key>
              <true/>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>Cập nhật thời tiết và địa điểm hiện tại</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          # Ký số tệp thực thi bằng ldid cho TrollStore
          ldid -S Payload/CarPlayWeather.app/CarPlayWeather || codesign -s - --force Payload/CarPlayWeather.app/CarPlayWeather

          # Đóng gói thành file .ipa chuẩn
          zip -r CarPlayWeather.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayWeather-IPA
          path: CarPlayWeather.ipa
