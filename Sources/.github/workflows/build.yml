name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Swift & Package IPA
        run: |
          mkdir -p Payload/CarPlayWidget.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          swiftc Sources/ViewController.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -framework UIKit \
            -framework WebKit \
            -o Payload/CarPlayWidget.app/CarPlayWidget
            
          cp Sources/Info.plist Payload/CarPlayWidget.app/Info.plist
          ldid -S Payload/CarPlayWidget.app/CarPlayWidget || codesign -s - --force Payload/CarPlayWidget.app/CarPlayWidget
          zip -r CarPlayWidget.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayWidget-IPA
          path: CarPlayWidget.ipa
